<style>
  :root{
    --midnight:#01426A;--atlas:#0074C8;--breeze:#E8F2F9;
    --red:#C0392B;--blue:#0074C8;--ink:#16313f;--green:#00805E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:#ffffff;color:var(--ink);
    line-height:1.5;-webkit-text-size-adjust:100%;}
  .wrap{max-width:880px;margin:0 auto;padding:44px 16px 0;}
  h1{color:var(--midnight);font-size:26px;margin:6px 0 2px;}
  .sub{color:var(--atlas);font-weight:600;font-size:14px;margin:0 0 14px;}
  .pdflink{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#fff;
    background:var(--green);border:1px solid var(--green);border-radius:6px;padding:9px 14px;
    text-decoration:none;margin-bottom:18px;}
  .pdflink:hover{filter:brightness(1.08);}
  .modebar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
  .modebtn{flex:1 1 auto;min-width:120px;border:1.5px solid var(--atlas);background:#fff;color:var(--midnight);
    font-family:inherit;font-size:13px;font-weight:700;padding:9px 10px;border-radius:8px;cursor:pointer;
    transition:background .12s,color .12s;}
  .modebtn.active{background:var(--midnight);color:#fff;border-color:var(--midnight);}
  .modebtn small{display:block;font-weight:400;font-size:11px;margin-top:2px;opacity:.85;}
  .toolrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 12px;
    padding:10px 12px;background:var(--breeze);border-radius:8px;font-size:13px;}
  .toolrow label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--midnight);}
  .progress{margin-left:auto;font-weight:700;color:var(--midnight);}
  .best{font-size:12px;color:var(--atlas);font-weight:600;}
  .card{border:1.5px solid var(--breeze);border-top:4px solid var(--atlas);border-radius:10px;
    padding:18px 18px 20px;background:#fff;box-shadow:0 1px 4px rgba(1,66,106,.06);margin-bottom:14px;}
  .phase-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    color:#fff;background:var(--midnight);padding:3px 9px;border-radius:5px;margin-bottom:10px;}
  .parallel-tag{background:var(--atlas);margin-left:6px;}
  .prompt{font-size:16px;font-weight:700;color:var(--midnight);margin:4px 0 6px;}
  .prompt .role{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;
    color:#fff;margin-right:6px;vertical-align:middle;}
  .role.pf{background:var(--red);}
  .role.pm{background:var(--midnight);}
  .hint{font-size:13px;color:#5a6b75;margin:0 0 8px;font-style:italic;}
  .answer{display:none;margin-top:10px;padding-top:12px;border-top:1px dashed var(--breeze);}
  .answer.show{display:block;}
  .answer .label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    color:var(--atlas);margin-bottom:4px;}
  .block{font-size:15px;margin:6px 0;}
  .block .head{font-weight:700;color:var(--midnight);}
  .red{color:var(--red);font-weight:600;}
  .blue{color:var(--blue);font-weight:600;}
  ul.steps{margin:6px 0 6px 4px;padding-left:18px;}
  ul.steps li{margin:3px 0;font-size:14px;}
  .gate{display:inline-block;width:8px;height:11px;border:1.3px solid var(--midnight);
    background:transparent;vertical-align:-1px;margin-right:6px;border-radius:1px;}
  .callout{background:var(--breeze);border-left:4px solid var(--atlas);padding:8px 12px;border-radius:0 6px 6px 0;
    margin:6px 0;font-size:15px;}
  .callout.redc{border-left-color:var(--red);}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{font-family:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:8px;cursor:pointer;border:none;}
  .btn-reveal{background:var(--atlas);color:#fff;}
  .btn-knew{background:#1e7e34;color:#fff;}
  .btn-review{background:var(--red);color:#fff;}
  .btn:active{transform:translateY(1px);}
  .kbd{font-size:11px;color:#5a6b75;margin-top:10px;}
  .kbd b{background:#fff;border:1px solid #cdd9e1;border-radius:4px;padding:1px 6px;color:var(--midnight);font-family:inherit;}
  .summary{text-align:center;padding:26px 16px;}
  .summary .pct{font-size:48px;font-weight:800;color:var(--midnight);line-height:1;}
  .summary .pl{font-size:14px;color:var(--atlas);font-weight:600;margin-bottom:14px;}
  .summary .stat{font-size:15px;margin:4px 0;}
  .summary .miss{text-align:left;max-width:520px;margin:16px auto 0;font-size:13px;color:#5a6b75;}
  .summary .miss b{color:var(--red);}
  .parallel-note{background:#fff6f4;border:1px dashed var(--red);border-radius:8px;padding:10px 12px;
    font-size:13px;color:var(--midnight);margin-bottom:12px;}
  @media (max-width:560px){
    .wrap{padding-top:42px;}
    h1{font-size:22px;}
    .modebtn{min-width:0;flex:1 1 30%;}
    .progress{margin-left:0;width:100%;}
  }
  /* ---- Sequence mode: breadcrumb trail + trigger boxes ---- */
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 12px;padding:8px 10px;
    background:var(--breeze);border-radius:8px;min-height:18px;}
  .crumbs .clab{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    color:var(--atlas);margin-right:4px;}
  .crumb{display:inline-block;font-size:11px;font-weight:700;color:var(--midnight);
    background:#fff;border:1px solid #cdd9e1;border-radius:12px;padding:2px 9px;}
  .crumb.cur{background:var(--midnight);color:#fff;border-color:var(--midnight);}
  .crumb-arrow{color:var(--atlas);font-weight:700;font-size:12px;}
  .crumbs .empty{font-size:11px;color:#5a6b75;font-style:italic;}
  .trigger{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;}
  .trigger.key{background:var(--breeze);border:1.5px solid var(--atlas);color:var(--midnight);
    box-shadow:0 1px 4px rgba(0,116,200,.12);}
  .trigger.key .bolt{font-size:16px;margin-right:4px;}
  .trigger.key .tlabel{font-weight:800;color:var(--atlas);}
  .trigger.quiet{background:#f6f9fc;border:1px dashed #cdd9e1;color:#5a6b75;font-weight:600;}
  .trigger .nxt{color:var(--midnight);font-weight:800;}
</style>
<style>
.srcpanel{max-height:0;overflow:hidden;opacity:0;background:#f2f8fc;border:1px solid var(--breeze);border-radius:8px;padding:0 14px;margin:8px 0 0;transition:max-height .2s,opacity .2s,padding .2s;}
.srcpanel.show{max-height:1600px;opacity:1;padding:12px 14px;}
.srclabel{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--atlas);margin-bottom:6px;}
.srctext{font-size:13.5px;line-height:1.55;color:var(--ink);}
.srcrow{margin-top:10px;}
.btn-src{background:#fff;color:var(--midnight);border:1.5px solid var(--atlas);}
.btn-src:hover{background:var(--breeze);}
</style>
</head>

<script>
"use strict";
(function(){
/* ---- Color helpers (RED = flight-deck/Capt + PF tags; BLUE = ground-crew + FMC/CDU) ---- */
function R(t){return '<span class="red">'+t+'</span>';}
function B(t){return '<span class="blue">'+t+'</span>';}
var GATE='<span class="gate" aria-label="Gate"></span>';

/* =====================================================================
   AUTHORITATIVE CONTENT
   Each FLOW block: phase, position label, an array of lines (HTML), gate flag,
   plus drill metadata: gateTrigger (for Gate drill) and callouts (for Callout drill).
   ===================================================================== */
var BLOCKS=[
/* ---------------- PHASE 1 - Power-up and Preflight Prep ---------------- */
{phase:"Phase 1 - Power-up and Preflight Prep", pos:"Cockpit Entry", gate:false,
 lines:["<span class=\"head\">Cockpit Entry:</span> ARRS; FFLAAP MD; Logbook"]},

{phase:"Phase 1 - Power-up and Preflight Prep", pos:"DEAD AIRCRAFT", gate:false,
 lines:[
   "<span class=\"head\">DEAD AIRCRAFT:</span> (Electric Pwr UP Flow: Read &amp; Do Chk)",
   "<ul class=\"steps\"><li>Batt Sw - On</li><li>Hydra Pumps - Off</li><li>Wipers - Off</li><li>Gr Lever - Dwn</li><li>Alt. Flap Swts - Off</li><li>External or APU - On</li></ul>"
 ]},

{phase:"Phase 1 - Power-up and Preflight Prep", pos:"Prelim. Preflight Flow", gate:true,
 lines:[
   "<span class=\"head\">Prelim. Preflt Flow:</span> ("+R("Capt or FO")+")",
   "(I SEE HOP) Logbook; IRS, Status, Eicas, Eng oil, Hyd, O2, Park Brk; Gnd Air or not?"
 ],
 gateTrigger:{q:"What runs at this gate, and what triggers it?",
   a:"<b>Prelim. Preflt Flow</b> (Capt or FO). Mnemonic I SEE HOP: Logbook; IRS, Status, EICAS, Eng oil, Hyd, O2, Park Brk; Gnd Air or not? Triggered after the Electric Power Up / dead-aircraft setup is complete."}},

{phase:"Phase 1 - Power-up and Preflight Prep", pos:"COMM-ATC", gate:true,
 lines:[
   "<span class=\"head\">COMM-ATC:</span> ("+R("Capt or FO")+") "+B("Logon"),
   B("KUSA")+" (Allows Flt Clnc to auto upload 30 minutes prior)."
 ],
 gateTrigger:{q:"Which logon happens here and what does it enable?",
   a:"<b>COMM-ATC</b> (Capt or FO): "+B("Logon")+" to "+B("KUSA")+". This allows the Flight Clearance to auto-upload 30 minutes prior to departure."}},

{phase:"Phase 1 - Power-up and Preflight Prep", pos:"PF: COMM - Flt Info", gate:true,
 lines:["<span class=\"prompt\"><span class=\"role pf\">PF</span></span> <span class=\"head\">COMM - Flt Info</span> ("+R("Request ATIS")+")"],
 gateTrigger:{q:"What does PF request at this gate?",
   a:"<b>PF: COMM - Flt Info</b> &mdash; "+R("Request ATIS")+"."}},

{phase:"Phase 1 - Power-up and Preflight Prep", pos:"PF: CDU (Initial & Nav Data)", gate:true, srcRef:"FCOM NP.21.2-21.3", src:"Timing: The Initial Data and Navigation Data entries must be complete before the flight instrument check during the Preflight Procedure. CDU IDENT page: Verify that the MODEL is correct. Verify that the ENG RATING is correct. Cycle the active NAV database to erase all previously pilot-entered data. Verify that the navigation database ACTIVE date range is current. CDU POS INIT page: Verify that the time is correct. If SET INERTIAL POS line is boxed: Enter the present position on the SET INERTIAL POS line. Use the most accurate latitude and longitude. CDU RTE page: Enter FLT NO exactly as it appears on the Dispatch Release and select ROUTE REQUEST. Once ROUTE UPLINK appears, select LOAD. Verify/enter ORIGIN and DEST airport. Verify/enter the route. ACTIVATE and execute RTE 1. CDU DEPARTURES page: Select the runway or HUD TAKEOFF. Select departure routing. Execute the runway or HUD TAKEOFF and departure routing. CDU ARRIVALS page: Select runway. Select arrival routing. (Note: Do not load an instrument approach before departure. This prevents unwanted automatic LNAV arming and activation if a TO/GA switch is pushed after takeoff.) Execute the arrival routing and runway. Verify that the route is correct on the RTE page. Check the LEGS pages as needed to ensure compliance with the flight plan.",
 lines:[
   "<span class=\"prompt\"><span class=\"role pf\">PF</span></span> <span class=\"head\">CDU</span> (NP.21.2 to NP.21.5). Do before the Flt Instrument Check:",
   "<span class=\"head\">Initial Data:</span> "+B("-IDENT")+", "+B("-POS INIT"),
   "<span class=\"head\">Nav Data:</span> "+B("-ROUTE")+", "+B("-DEPT")+", "+B("-ARRIVAL")+", "+B("-FIX")+", "+B("-ANP/RNP")+", "+B("-NAV RAD")
 ],
 gateTrigger:{q:"What CDU work runs here and when?",
   a:"<b>PF: CDU</b> (NP.21.2 to NP.21.5), done before the Flt Instrument Check. Initial Data: "+B("IDENT")+", "+B("POS INIT")+". Nav Data: "+B("ROUTE")+", "+B("DEPT")+", "+B("ARRIVAL")+", "+B("FIX")+", "+B("ANP/RNP")+", "+B("NAV RAD")+"."}},

/* ---------------- PHASE 2 - FMC Build and Preflight ---------------- */
{phase:"Phase 2 - FMC Build and Preflight", pos:"PF: CDU PERF Data", gate:true, srcRef:"FCOM NP.21.4", src:"Timing: The Performance Data entries must be complete before the Before Start Checklist. CDU PERF INIT page: If PERF INIT DATA is available: Select ACCEPT. Verify/enter the planned ZFW. Verify that the FUEL on the CDU, the Dispatch Release, and EICAS agree. Verify that the fuel is sufficient for flight. Verify/enter RESERVES as the sum of the hold and the alternate (as applicable) fuel from the Dispatch Release. Verify/enter CRZ ALT. Verify/enter COST INDEX. Enter STEP SIZE 0.",
 lines:[
   "<span class=\"prompt\"><span class=\"role pf\">PF</span></span> <span class=\"head\">CDU PERF Data.</span> Do prior to the Before Start Checklist:",
   B("-ZFW")+", "+B("-Fuel")+", "+B("-CRZ Altitude")+", "+B("-Cost Index")+", "+B("-Step size = 0")
 ],
 gateTrigger:{q:"What PERF data is entered here and when?",
   a:"<b>PF: CDU PERF Data</b>, done prior to the Before Start Checklist: "+B("ZFW")+", "+B("Fuel")+", "+B("CRZ Altitude")+", "+B("Cost Index")+", "+B("Step size = 0")+"."}},

{phase:"Phase 2 - FMC Build and Preflight", pos:"PF: COMM-COMPANY", gate:true, srcRef:"FCOM NP.21.5", src:"COMPANY - FLIGHT INIT page: Verify or enter FLIGHT NUMBER. Enter SCHEDULED DATE (numeric day only) from the Dispatch Release. (Note: If SCHEDULED DATE does not match the date on the Dispatch Release, some ACARS functions will not work.) Verify/enter ORIGIN STATION. Verify/enter DESTINATION STATION. Enter CAPT, F/O, and R/O employee numbers. Preliminary Performance: Request. (Note: Requesting the preliminary performance is a necessary step for AeroData to produce the final performance. The preliminary performance should not be loaded into the FMS during preflight, and does not need to be printed.)",
 lines:[
   "<span class=\"prompt\"><span class=\"role pf\">PF</span></span> <span class=\"head\">COMM-COMPANY:</span> "+B("-FLT INIT")+";",
   B("-Rqst PRELIMINARY PERFORMANCE")+"; ("+B("Rwy T/Off Data")+")"
 ],
 gateTrigger:{q:"What COMPANY comm happens at this gate?",
   a:"<b>PF: COMM-COMPANY</b> &mdash; "+B("FLT INIT")+"; "+B("Rqst PRELIMINARY PERFORMANCE")+"; ("+B("Rwy T/Off Data")+")."}},

{phase:"Phase 2 - FMC Build and Preflight", pos:"PM: Walk-around", gate:true,
 lines:["<span class=\"prompt\"><span class=\"role pm\">PM</span></span> <span class=\"head\">Walk-around</span>"],
 gateTrigger:{q:"Who performs the exterior inspection here?",
   a:"<b>PM: Walk-around</b> (exterior inspection performed by the PM)."}},

{phase:"Phase 2 - FMC Build and Preflight", pos:"Individual Cockpit Preflight", gate:true,
 lines:[
   "<span class=\"head\">Individual Cockpit Preflight:</span> Capt / FO ("+R("Waterfall")+")",
   "(HUD down = Ready for chklst)"
 ],
 gateTrigger:{q:"What runs here and what signals readiness?",
   a:"<b>Individual Cockpit Preflight:</b> Capt / FO "+R("Waterfall")+". HUD down = Ready for checklist."}},

{phase:"Phase 2 - FMC Build and Preflight", pos:"Preflight Checklist", gate:true,
 lines:["<span class=\"head\">&ldquo;Preflight Checklist&rdquo;</span>"],
 gateTrigger:{q:"Which checklist runs at this gate?",
   a:"The <b>&ldquo;Preflight Checklist&rdquo;</b>, run after the individual cockpit preflights (HUD down = ready)."}},

{phase:"Phase 2 - FMC Build and Preflight", pos:"ATC Clearance", gate:true,
 lines:["<span class=\"head\">ATC Clearance:</span> Domestic - KUSA; HNL - Comm-Flt Info-; Dept Clnc Req"],
 gateTrigger:{q:"How is ATC clearance obtained here?",
   a:"<b>ATC Clearance:</b> Domestic - KUSA; HNL - Comm-Flt Info-; Dept Clnc Req."}},

{phase:"Phase 2 - FMC Build and Preflight", pos:"Joint Verbal FMC Route Check", gate:true,
 lines:[
   "<span class=\"head\">Joint Verbal FMC Route Check:</span>",
   "<span class=\"prompt\"><span class=\"role pf\">PF</span></span> Reads ATC Clnc",
   "<span class=\"prompt\"><span class=\"role pm\">PM</span></span> Cxchks Clnc w/RTE page and Rts"
 ],
 gateTrigger:{q:"What happens during the joint route check?",
   a:"<b>Joint Verbal FMC Route Check:</b> PF reads ATC Clnc; PM cross-checks the clearance against the RTE page and the routes."}},

{phase:"Phase 2 - FMC Build and Preflight", pos:"Winds loaded", gate:true,
 lines:["<span class=\"head\">Winds loaded:</span> Legs-Rte Data; PROG: Dist + Lndg Fuel"],
 gateTrigger:{q:"What is verified after winds are loaded?",
   a:"<b>Winds loaded:</b> Legs-Rte Data; on PROG check Dist + Lndg Fuel."}},

/* ---------------- PHASE 3 - Takeoff Data and Final Checks ---------------- */
{phase:"Phase 3 - Takeoff Data and Final Checks", pos:"Takeoff Brief", gate:false,
 lines:["<span class=\"head\">Takeoff Brief:</span> Flaps, A/T, CG, V-Spds; Accel/Thrust heights; SID, Threats; Arm VNAV. LNAV?"]},

{phase:"Phase 3 - Takeoff Data and Final Checks", pos:"LCO &amp; TLR", gate:false,
 lines:[
   "<span class=\"head\">LCO &amp; TLR:</span> (from printer)",
   "<span class=\"prompt\"><span class=\"role pf\">PF</span></span> Loads; *Company-Performance-Takeoff Data pg: LOAD FMC; *CDU Perf Init: ACCEPT; *CDU T/Off pg 1/2",
   "<span class=\"prompt\"><span class=\"role pm\">PM</span></span> Verifies entries"
 ]},

{phase:"Phase 3 - Takeoff Data and Final Checks", pos:"Gate Agent/Station Mgr", gate:true,
 lines:["<span class=\"head\">Gate Agent/Station Mgr:</span> Check Fuel on Board; Check EICAS"],
 gateTrigger:{q:"What is verified with the Gate Agent / Station Mgr?",
   a:"<b>Gate Agent/Station Mgr:</b> Check Fuel on Board; Check EICAS."}},

{phase:"Phase 3 - Takeoff Data and Final Checks", pos:"Flight Attendant", gate:true,
 lines:["<span class=\"head\">Flight Attendant:</span> Cabin Secure; Doors in Auto"],
 gateTrigger:{q:"What is confirmed with the Flight Attendant at this gate?",
   a:"<b>Flight Attendant:</b> Cabin Secure; Doors in Auto."}},

{phase:"Phase 3 - Takeoff Data and Final Checks", pos:"EICAS", gate:true,
 lines:["<span class=\"head\">EICAS:</span> (4 / 6); Nosewheel lockout"],
 gateTrigger:{q:"What EICAS check runs at this gate?",
   a:"<b>EICAS:</b> (4 / 6); Nosewheel lockout."}},

/* ---------------- PHASE 4 - Pushback, Ramp Crew side ---------------- */
{phase:"Phase 4 - Pushback, Ramp Crew side", parallel:"PARALLEL w/ Phase 5 (Flight-deck)", pos:"Ramp Crew (pre-push)", gate:false,
 lines:[
   "<span class=\"head\">Ramp Crew:</span>",
   "<div class=\"callout\">"+B("-Gnd to Flt Dk. Confirm Brakes set?")+"</div>",
   "<div class=\"callout\">"+B("-Can we disconnect External/Air?")+"</div>",
   "<div class=\"callout\">"+B("-&ldquo;Walk Around Complete&rdquo;")+"</div> (Trigger for FO flow)",
   "<div class=\"callout\">"+B("-&ldquo;Ready for Push&rdquo;")+"</div>"
 ],
 callouts:[
   {speaker:"BLUE",label:"Ground crew",text:"Gnd to Flt Dk. Confirm Brakes set?"},
   {speaker:"BLUE",label:"Ground crew",text:"Can we disconnect External/Air?"},
   {speaker:"BLUE",label:"Ground crew",text:"Walk Around Complete"},
   {speaker:"BLUE",label:"Ground crew",text:"Ready for Push"}
 ]},

{phase:"Phase 4 - Pushback, Ramp Crew side", parallel:"PARALLEL w/ Phase 5 (Flight-deck)", pos:"Ramp Crew (push)", gate:false,
 lines:[
   "<span class=\"head\">Ramp Crew:</span>",
   "<div class=\"callout\">"+B("-Cleared to Push")+"</div>",
   "<div class=\"callout\">"+B("-Cleared to Start engines")+"</div> (After P/back complete)",
   "<div class=\"callout\">"+B("-Push complete, Set brakes.")+"</div>"
 ],
 callouts:[
   {speaker:"BLUE",label:"Ground crew",text:"Cleared to Push"},
   {speaker:"BLUE",label:"Ground crew",text:"Cleared to Start engines"},
   {speaker:"BLUE",label:"Ground crew",text:"Push complete, Set brakes."}
 ]},

{phase:"Phase 4 - Pushback, Ramp Crew side", parallel:"PARALLEL w/ Phase 5 (Flight-deck)", pos:"Before Taxi Flow", gate:true,
 lines:[

/* =====================================================================
   BUILD DRILL ITEM LISTS
   ===================================================================== */
function buildSeqItems(){
  return SEQ.map(function(s,i){
    var actionsHtml=s.actions.map(function(l){return '<div class="block">'+l+'</div>';}).join("");
    var trigHtml;
    if(s.next){
      if(s.key){
        trigHtml='<div class="trigger key"><span class="bolt">&#9889;</span>'+
          '<span class="tlabel">TRIGGER:</span> '+s.trig+' &rarr; fires <span class="nxt">'+s.next+'</span></div>';
      }else{
        trigHtml='<div class="trigger quiet">&rarr; next: <span class="nxt">'+s.next+'</span></div>';
      }
    }else{
      trigHtml='<div class="trigger quiet">End of setup sequence.</div>';
    }
    return {id:"seq"+i, type:"seq", seqIdx:i, src:s.src, srcRef:s.srcRef,
      prompt:"<span class=\"phase-tag\">"+s.phase+"</span><div class=\"prompt\">"+(i+1)+". "+s.name+"</div>",
      hint:"Recall this step's key actions AND the trigger that fires the next step.",
      answer:actionsHtml+trigHtml};
  });
}
function buildFlowItems(){
  return BLOCKS.map(function(b,i){
    return {id:"flow"+i, type:"flow", src:b.src, srcRef:b.srcRef,
      prompt:"<span class=\"phase-tag\">"+b.phase+"</span>"+(b.parallel?"<span class=\"phase-tag parallel-tag\">"+b.parallel+"</span>":"")+
        "<div class=\"prompt\">"+(b.gate?GATE:"")+b.pos+"</div>",
      hint:"Recite this block's actions / next call, then reveal.",
      answer:(b.gate?'<div class="parallel-note" style="display:inline-block;background:none;border:none;padding:0;margin:0 0 4px;">'+GATE+' <b>GATE</b></div>':'')+
        b.lines.map(function(l){return '<div class="block">'+l+'</div>';}).join("")};
  });
}
function buildGateItems(){
  var out=[];
  BLOCKS.forEach(function(b,i){
    if(b.gate && b.gateTrigger){
      out.push({id:"gate"+i, type:"gate", src:b.src, srcRef:b.srcRef,
        prompt:"<span class=\"phase-tag\">"+b.phase+"</span><div class=\"prompt\">"+GATE+b.pos+"</div>",
        hint:b.gateTrigger.q,
        answer:'<div class="block">'+b.gateTrigger.a+'</div>'});
    }
  });
  return out;
}
function buildCalloutItems(){
  // Captain-focused: the ground/cue is shown automatically; you recall ONLY the Captain's exact line.
  var out=[];
  BLOCKS.forEach(function(b,i){
    if(b.callouts){
      b.callouts.forEach(function(c,j){
        if(c.speaker!=="RED")return;            // only drill the Captain's lines
        var cueBox = c.cue ? '<div class="callout"><b>Cue (auto):</b> '+B(c.cue)+'</div>' : '';
        out.push({id:"call"+i+"_"+j, type:"callout",
          prompt:"<span class=\"phase-tag\">"+b.phase+"</span>"+cueBox+"<div class=\"prompt\">What does the "+R("Captain")+" say? &mdash; exact words</div>",
          hint:"No need to memorize the ground words — let them prompt your line. Captain (RED), exact wording.",
          answer:'<div class="callout redc">'+R("&ldquo;"+c.text+"&rdquo;")+'</div>'});
      });
    }
  });
  return out;
}

/* =====================================================================
   ENGINE
   ===================================================================== */
var app=document.getElementById('app');
var progressEl=document.getElementById('progress');
var bestEl=document.getElementById('bestLine');
var shuffleEl=document.getElementById('shuffleToggle');
var shuffleWrap=document.getElementById('shuffleWrap');
var modeBtns=Array.prototype.slice.call(document.querySelectorAll('.modebtn'));

/* Shuffle is disabled/hidden in Sequence mode (order matters) */
function updateShuffleVisibility(m){
  if(m==="seq"){ shuffleEl.checked=false; shuffleWrap.style.display="none"; }
  else{ shuffleWrap.style.display=""; }
}

var state={mode:"seq", items:[], idx:0, revealed:false, srcOpen:false, missed:[], knew:0, total:0, redrill:false};

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
function itemsForMode(m){
  if(m==="seq")return buildSeqItems();
  if(m==="gate")return buildGateItems();
  if(m==="callout")return buildCalloutItems();
  return buildFlowItems();
}
/* breadcrumb trail of previously completed step short-names (Sequence mode) */
function crumbsHtml(){
  var cur=state.items[state.idx];
  var curIdx=(cur&&typeof cur.seqIdx==="number")?cur.seqIdx:state.idx;
  var html='<div class="crumbs"><span class="clab">Path</span>';
  if(curIdx===0){
    html+='<span class="empty">start of sequence</span>';
  }else{
    for(var i=0;i<curIdx;i++){
      if(i>0)html+='<span class="crumb-arrow">&rarr;</span>';
      html+='<span class="crumb">'+SEQ[i].short+'</span>';
    }
    html+='<span class="crumb-arrow">&rarr;</span><span class="crumb cur">'+SEQ[curIdx].short+'</span>';
  }
  html+='</div>';
  return html;
}
function lsKey(m){return "as_setup_best_"+m;}
function loadBest(m){
  try{var v=localStorage.getItem(lsKey(m));return v?JSON.parse(v):null;}catch(e){return null;}
}
function saveBest(m,pct,last){
  try{
    var cur=loadBest(m)||{best:0};
    var best=Math.max(cur.best||0,pct);
    localStorage.setItem(lsKey(m),JSON.stringify({best:best,last:last}));
  }catch(e){}
}
function showBestLine(){
  var b=loadBest(state.mode);
  if(b){bestEl.textContent="Best "+b.best+"%"+(typeof b.last==="number"?" · Last "+b.last+"%":"");}
  else{bestEl.textContent="";}
}

function startSession(m,redrillItems){
  state.mode=m;
  state.redrill=!!redrillItems;
  updateShuffleVisibility(m);
  state.items=redrillItems?redrillItems.slice():itemsForMode(m);
  if(m!=="seq" && shuffleEl.checked && !redrillItems) shuffle(state.items);
  state.idx=0; state.revealed=false; state.srcOpen=false; state.missed=[]; state.knew=0;
  state.total=state.items.length;
  showBestLine();
  render();
}

function updateProgress(){
  if(state.idx>=state.total){progressEl.textContent="";return;}
  progressEl.textContent=(state.redrill?"Redrill ":"")+"Item "+(state.idx+1)+" of "+state.total;
}

function render(){
  updateProgress();
  if(state.idx>=state.total){return renderSummary();}
  var it=state.items[state.idx];
  var html='';
  if(state.mode==="seq"){ html+=crumbsHtml(); }
  html+='<div class="card">'+
    it.prompt+
    '<div class="hint">'+it.hint+'</div>'+
    '<div class="answer'+(state.revealed?' show':'')+'" id="ans"><span class="label">Answer</span>'+it.answer+'</div>'+
    (it.src?'<div class="srcpanel'+(state.srcOpen?' show':'')+'" id="srcp"><span class="srclabel">FCOM Source: '+it.srcRef+'</span><div class="srctext">'+it.src+'</div></div>':'')+
    '<div class="btnrow" id="btns"></div>'+
    (it.src?'<div class="srcrow"><button class="btn btn-src" id="bSrc">'+(state.srcOpen?'Hide source':'Source')+'</button></div>':'')+
    '<div class="kbd"><b>Space</b>/<b>Enter</b> reveal then advance · <b>K</b> Knew it · <b>R</b> Review</div>'+
  '</div>';
  app.innerHTML=html;
  renderButtons();
  var bs=document.getElementById('bSrc'); if(bs)bs.onclick=toggleSrc;
}
function renderButtons(){
  var btns=document.getElementById('btns');
  if(!state.revealed){
    btns.innerHTML='<button class="btn btn-reveal" id="bReveal">Reveal</button>';
    document.getElementById('bReveal').onclick=reveal;
  }else{
    btns.innerHTML='<button class="btn btn-knew" id="bKnew">Knew it</button>'+
      '<button class="btn btn-review" id="bReview">Review</button>';
    document.getElementById('bKnew').onclick=function(){grade(true);};
    document.getElementById('bReview').onclick=function(){grade(false);};
  }
}
function reveal(){
  state.revealed=true;
  var a=document.getElementById('ans'); if(a)a.classList.add('show');
  renderButtons();
}
function toggleSrc(){ state.srcOpen=!state.srcOpen; render(); }
function grade(knew){
  var it=state.items[state.idx];
  if(knew)state.knew++; else state.missed.push(it);
  state.idx++; state.revealed=false; state.srcOpen=false;
  render();
}
function renderSummary(){
  var pct=state.total?Math.round((state.knew/state.total)*100):0;
  if(!state.redrill)saveBest(state.mode,pct,pct);
  showBestLine();
  var missHtml="";
  if(state.missed.length){
    missHtml='<div class="miss"><b>'+state.missed.length+' to review:</b><ul>'+
      state.missed.map(function(m){
        var label=m.prompt.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
        return '<li>'+label+'</li>';
      }).join("")+'</ul></div>';
  }
  var redrillBtn=state.missed.length?
    '<div class="btnrow" style="justify-content:center"><button class="btn btn-review" id="bRedrill">Redrill '+state.missed.length+' missed</button></div>':'';
  var restartBtn='<div class="btnrow" style="justify-content:center"><button class="btn btn-reveal" id="bRestart">Start over</button></div>';
  app.innerHTML='<div class="card summary">'+
    '<div class="pct">'+pct+'%</div>'+
    '<div class="pl">'+state.knew+' of '+state.total+' knew it</div>'+
    redrillBtn+restartBtn+missHtml+
  '</div>';
  if(state.missed.length){
    var redrillItems=state.missed.slice();
    document.getElementById('bRedrill').onclick=function(){startSession(state.mode,redrillItems);};
  }
  document.getElementById('bRestart').onclick=function(){startSession(state.mode);};
}

/* keyboard */
document.addEventListener('keydown',function(e){
  if(state.idx>=state.total)return;
  var k=e.key.toLowerCase();
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    if(!state.revealed)reveal(); else grade(true);
  }else if(k==='k'){
    if(state.revealed)grade(true);
  }else if(k==='r'){
    if(state.revealed)grade(false);
  }else if(k==='s'){
    var cur=state.items[state.idx];
    if(cur&&cur.src)toggleSrc();
  }
});

/* mode buttons */
modeBtns.forEach(function(btn){
  btn.onclick=function(){
    modeBtns.forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    startSession(btn.getAttribute('data-mode'));
  };
});
shuffleEl.onchange=function(){startSession(state.mode);};

/* go */
startSession("seq");
})();

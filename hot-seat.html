<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B787 Hot Seat</title>
<style>
:root{--bg:#01172b;--panel:#062b46;--panel2:#0a3556;--line:#13486e;--ink:#eaf3fb;--muted:#8fb3cf;
 --mid:#01426A;--atlas:#0074C8;--breeze:#00C7E6;--green:#C0E585;--amber:#f2a65a;--red:#ff6b6b;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}
.wrap{width:100%;max-width:680px}
header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;gap:12px}
h1{font-size:15px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0}
h1 .sub{color:var(--breeze);font-weight:600}
.src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hud{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:12px;gap:10px;flex-wrap:wrap}
.hud b{color:var(--ink)}
.clock{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--green)}
.clock.warn{color:var(--amber)} .clock.crit{color:var(--red)}
.tbar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.tfill{height:100%;width:100%;background:var(--green);transition:width .1s linear}
.tfill.warn{background:var(--amber)} .tfill.crit{background:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 22px;min-height:230px;display:flex;flex-direction:column;gap:12px}
.inject{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.scn{font-size:18px;line-height:1.4;color:var(--muted)}
.warnbox{background:#2a0f12;border:1px solid #7a2730;border-left:4px solid var(--red);border-radius:6px;padding:10px 14px}
.warnbox .ttl{font-size:22px;font-weight:800;letter-spacing:.04em;color:#ffd0d0}
.warnbox .ref{font-family:var(--mono);font-size:11px;color:#d99}
.cue{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.readout{background:#02101f;border:1px solid #0c3a5e;border-left:3px solid var(--green);border-radius:6px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.readout .ln{margin:3px 0}.readout .num{display:inline-block;min-width:18px;color:var(--breeze);font-weight:700;font-family:var(--mono)}
.readout .sub{margin-left:22px;color:#cfe2f2}.readout .bul{margin-left:34px;color:#cfe2f2}
.readout b{color:var(--green)} .readout i{color:var(--muted)}
.spacer{flex:1}
.controls{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;border-radius:8px;padding:13px 18px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);transition:.1s}
button:hover{border-color:var(--breeze)}
.primary{background:var(--atlas);color:#fff;border-color:var(--atlas);flex:1}
.knew{border-color:var(--green);color:var(--green);flex:1}.knew:hover{background:rgba(192,229,133,.14)}
.rev{border-color:var(--amber);color:var(--amber);flex:1}.rev:hover{background:rgba(242,166,90,.14)}
.start{background:var(--atlas);color:#fff;border-color:var(--atlas);font-size:16px;padding:14px 26px}
.over{text-align:center;padding:28px 14px}
.over .big{font-family:var(--mono);font-size:50px;color:var(--green);font-weight:700}
.over .lbl{color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.over .best{color:var(--amber);font-family:var(--mono);font-size:13px;margin:10px 0 22px}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
@media(max-width:480px){.warnbox .ttl{font-size:18px}}
</style></head>
<body>
<div style="position:fixed;top:0;left:12px;z-index:9999;"><a href="index.html" style="display:inline-block;font-family:'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:700;color:#fff;background:#01416e;padding:5px 14px;border-radius:0 0 6px 6px;text-decoration:none;">&#9664; B787 Study Portal</a></div>
<div class="wrap">
 <header><h1>Hot Seat <span class="sub">// Recite Under Pressure</span></h1><span class="src">QRH R7</span></header>
 <div id="app"></div>
 <div class="hint">Read the inject, recite the memory items ALOUD, then Reveal to check &nbsp;&middot;&nbsp; Space = reveal &nbsp;&middot;&nbsp; beat the clock</div>
</div>
<script>
const DATA=[
 {name:"CABIN ALTITUDE",ref:"QRH 2.1",cond:"Cabin altitude is excessive.",steps:[
   {t:'n',n:'1',h:'Don the oxygen masks.'},
   {t:'n',n:'2',h:'Establish crew communications.'},
   {t:'n',n:'3',h:'Check the cabin altitude and rate.'},
   {t:'n',n:'4',h:'If the cabin altitude is uncontrollable:'},
   {t:'s',h:'PASS OXYGEN switch: <b>Push to ON and hold for 1 second</b>'},
   {t:'s',h:'Without delay, descend to the lowest safe altitude or <b>10,000 feet</b>, whichever is higher.'},
   {t:'s',h:'To descend:'},
   {t:'b',h:'Move the thrust levers to idle'},
   {t:'b',h:'Extend the speedbrakes'},
   {t:'b',h:'If structural integrity is in doubt, limit airspeed and avoid high maneuvering loads'},
   {t:'b',h:'Descend at Vmo/Mmo'},
 ]},
 {name:"ABORTED ENGINE START L, R",ref:"QRH 7.1",cond:"On the ground, an aborted engine start is needed.",steps:[
   {t:'n',n:'1',h:'FUEL CONTROL switch (affected side): <b>CUTOFF</b>'},
 ]},
 {name:"DUAL ENG FAIL/STALL",ref:"QRH 7.2",cond:"Engine speed for both engines is below idle.",steps:[
   {t:'n',n:'1',h:'FUEL CONTROL switches (both): <b>CUTOFF, then RUN</b>'},
   {t:'n',n:'2',h:'RAM AIR TURBINE switch: <b>Push and hold for 1 second</b>'},
 ]},
 {name:"ENG AUTOSTART L, R",ref:"QRH 7.3",cond:"Autostart did not start the engine.",steps:[
   {t:'n',n:'1',h:'FUEL CONTROL switch (affected side): <i>Confirm</i> <b>CUTOFF</b>'},
 ]},
 {name:"ENG LIMIT EXCEED L, R",ref:"QRH 7.4",cond:"An engine limit exceedance occurs.",steps:[
   {t:'n',n:'1',h:'A/T ARM switch (affected side): <i>Confirm</i> <b>OFF</b>'},
   {t:'n',n:'2',h:'Thrust lever (affected side): <i>Confirm</i> <b>Retard</b> until ENG LIMIT EXCEED message blanks or the thrust lever is at idle'},
 ]},
 {name:"ENG SURGE L, R",ref:"QRH 7.7",cond:"An engine surge or stall that requires crew action is detected.",steps:[
   {t:'n',n:'1',h:'A/T ARM switch (affected side): <i>Confirm</i> <b>OFF</b>'},
   {t:'n',n:'2',h:'Thrust lever (affected side): <i>Confirm</i> <b>Retard</b> until the ENG SURGE message blanks or the thrust lever is at idle'},
 ]},
 {name:"ENG SVR DAMAGE/SEP L, R",ref:"QRH 7.10",cond:"Airframe vibrations with abnormal engine indications, or engine separation.",steps:[
   {t:'n',n:'1',h:'A/T ARM switch (affected side): <i>Confirm</i> <b>OFF</b>'},
   {t:'n',n:'2',h:'Thrust lever (affected side): <i>Confirm</i> <b>Idle</b>'},
   {t:'n',n:'3',h:'FUEL CONTROL switch (affected side): <i>Confirm</i> <b>CUTOFF</b>'},
   {t:'n',n:'4',h:'Engine fire switch (affected side): <i>Confirm</i> <b>Pull</b>'},
 ]},
 {name:"FIRE ENG L, R",ref:"QRH 8.2",cond:"Fire is detected in the affected engine. (Memory item applies in flight; on the ground it routes to step 13.)",steps:[
   {t:'n',n:'1',h:'Choose one:'},
   {t:'b',h:'On the ground: Go to step 13'},
   {t:'b',h:'In flight: Go to step 2'},
   {t:'n',n:'2',h:'A/T ARM switch (affected side): <i>Confirm</i> <b>OFF</b>'},
   {t:'n',n:'3',h:'Thrust lever (affected side): <i>Confirm</i> <b>Idle</b>'},
   {t:'n',n:'4',h:'FUEL CONTROL switch (affected side): <i>Confirm</i> <b>CUTOFF</b>'},
   {t:'n',n:'5',h:'Engine fire switch (affected side): <i>Confirm</i> <b>Pull</b>'},
   {t:'n',n:'6',h:'If the FIRE ENG message stays shown:'},
   {t:'s',h:'Engine fire switch (affected side): <b>Rotate to the stop and hold for 1 second</b>'},
 ]},
 {name:"STABILIZER",ref:"QRH 9.1",cond:"Stabilizer movement without a signal to trim, or the stabilizer is failed.",steps:[
   {t:'n',n:'1',h:'STAB cutout switches (both): <b>CUTOUT</b>'},
   {t:'n',n:'2',h:'Do not exceed the current airspeed.'},
 ]},
 {name:"AIRSPEED UNRELIABLE",ref:"QRH 10.1",cond:"The airspeed or Mach indications disagree with AOA calculated airspeed.",steps:[
   {t:'n',n:'1',h:'Autopilot disconnect switch: <b>Push</b>'},
   {t:'n',n:'2',h:'A/T ARM switches (both): <b>OFF</b>'},
   {t:'n',n:'3',h:'F/D switches (both): <b>OFF</b>'},
   {t:'n',n:'4',h:'Set the following gear up pitch attitude and thrust:'},
   {t:'b',h:'Flaps extended: <b>10 deg and 85% N1</b>'},
   {t:'b',h:'Flaps up: <b>4 deg and 70% N1</b>'},
 ]},
];
const SCN={
 "CABIN ALTITUDE":"Climbing through FL310, ZLA airspace. The CABIN ALTITUDE warning sounds.",
 "ABORTED ENGINE START L, R":"At the gate, starting the right engine. Start needs to be aborted.",
 "DUAL ENG FAIL/STALL":"FL370 over the Pacific. Both engines roll back below idle.",
 "ENG AUTOSTART L, R":"Engine start in progress. Autostart fails to start the engine.",
 "ENG LIMIT EXCEED L, R":"Takeoff roll, 80 kt. ENG LIMIT EXCEED on the left.",
 "ENG SURGE L, R":"Climb out of SEA. Loud bang and an ENG SURGE on the right.",
 "ENG SVR DAMAGE/SEP L, R":"FL240 climbing. Heavy airframe vibration with abnormal engine indications.",
 "FIRE ENG L, R":"Just airborne, 1,000 ft AGL. FIRE ENG L.",
 "STABILIZER":"Cruise FL390. The stabilizer is moving without a trim command.",
 "AIRSPEED UNRELIABLE":"Climbing through 10,000 ft. The airspeed indications disagree."
};
const TMAX=20000;
let queue,idx,passes,timeBonus,revealed,timer,t0,locked;
let best=+(localStorage.getItem('hs_best')||0);
const app=document.getElementById('app');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stepsHTML(steps){return steps.map(s=>{if(s.t==='n')return `<div class="ln"><span class="num">${s.n}</span>${s.h}</div>`;if(s.t==='s')return `<div class="ln sub">${s.h}</div>`;return `<div class="ln bul">&bull; ${s.h}</div>`;}).join('')}
function startGame(){queue=shuffle([...Array(DATA.length).keys()]);idx=0;passes=0;timeBonus=0;round();}
function round(){
 if(idx>=queue.length)return over();
 const d=DATA[queue[idx]];revealed=false;locked=false;
 app.innerHTML=`<div class="hud"><span>inject <b>${idx+1}</b> / ${queue.length}</span><span>nailed <b>${passes}</b></span><span class="clock" id="clk">${(TMAX/1000).toFixed(0)}s</span></div>
  <div class="tbar"><div class="tfill" id="tf"></div></div>
  <div class="card">
   <div class="inject">PIC &mdash; memory items</div>
   <div class="scn">${SCN[d.name]||d.cond}</div>
   <div class="warnbox"><div class="ttl">${d.name}</div><div class="ref">${d.ref} &middot; ${d.cond}</div></div>
   <div id="body"></div>
   <div class="spacer"></div>
   <div class="controls" id="ctrl"><button class="primary" onclick="reveal()">Reveal steps &nbsp;(Space)</button></div>
  </div>`;
 const tf=document.getElementById('tf'),clk=document.getElementById('clk');
 clearInterval(timer);t0=Date.now();
 timer=setInterval(()=>{const left=TMAX-(Date.now()-t0);const pct=Math.max(0,left/TMAX*100);
  tf.style.width=pct+'%';tf.className='tfill'+(pct<50?' warn':'')+(pct<22?' crit':'');
  clk.textContent=Math.max(0,left/1000).toFixed(0)+'s';clk.className='clock'+(pct<50?' warn':'')+(pct<22?' crit':'');
  if(left<=0){clearInterval(timer);if(!revealed)reveal(true);}},80);
}
function reveal(timeout){
 if(revealed)return;revealed=true;clearInterval(timer);
 const left=Math.max(0,TMAX-(Date.now()-t0));const d=DATA[queue[idx]];
 document.getElementById('body').innerHTML=`<div class="readout">${stepsHTML(d.steps)}</div>`;
 document.getElementById('ctrl').innerHTML=`<button class="knew" onclick="grade(true,${left})">Nailed it &nbsp;K</button><button class="rev" onclick="grade(false,0)">Missed &nbsp;R</button>`;
 if(timeout){document.querySelector('.clock').textContent='0s';}
}
function grade(ok,left){
 if(locked)return;locked=true;
 if(ok){passes++;timeBonus+=Math.round(left/1000);}
 idx++;round();
}
function over(){
 const pct=Math.round(passes/queue.length*100);const sc=passes*10+timeBonus;
 if(sc>best){best=sc;localStorage.setItem('hs_best',best);}
 app.innerHTML=`<div class="card"><div class="over"><div class="big">${pct}%</div><div class="lbl">nailed cold (${passes}/${queue.length})</div>
  <div class="best">score ${sc} &nbsp;(+${timeBonus} time bonus) &middot; best ${best}</div>
  <button class="start" onclick="startGame()">New scramble</button></div></div>`;
}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!revealed)reveal();}else if((e.key==='k'||e.key==='K')&&revealed){grade(true,Math.max(0,TMAX-(Date.now()-t0)));}else if((e.key==='r'||e.key==='R')&&revealed){grade(false,0);}});
function intro(){app.innerHTML=`<div class="card"><div class="over"><div class="lbl" style="margin-bottom:8px">10 emergency injects, QRH R7 verbatim</div>
 <div class="scn" style="font-size:19px;text-align:center;color:#eaf3fb;margin:4px 0 6px">You're in the hot seat.</div>
 <div class="src" style="margin:6px 0 20px;color:#8fb3cf">An emergency drops in &middot; recite aloud &middot; ${TMAX/1000}s to reveal</div>
 <button class="start" onclick="startGame()">Start</button>${best?`<div class="best">best ${best}</div>`:''}</div></div>`;}
intro();
</script>
<footer style="width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:28px auto 0;">
<img src="B787_night.jpg" alt="Boeing 787" style="width:380px;max-width:60%;height:auto;border-radius:6px;">

<div style="width:100%;text-align:right;font-size:11px;color:#b1d887;font-family:inherit;">Ver 1.3</div>
</footer>
</body></html>

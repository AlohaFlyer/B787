<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B787 Study Portal</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<meta name="apple-mobile-web-app-title" content="AS 787 Study">
<meta name="application-name" content="AS 787 Study">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#01416e">
<style>
  :root{--midnight:#01416e;--atlas:#007cba;--blue:#00b2d6;--breeze:#bfe9f4;--ice:#E8F3FA;--good:#b1d887;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--ice);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .banner{display:flex;align-items:center;justify-content:space-between;background:var(--midnight);padding:12px 20px;width:100%;max-width:560px;margin-top:24px;}
  .banner img{height:30px;}
  .banner span{color:var(--good);font-size:20px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
  .menu{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;padding:24px 10px;}
  .menu a{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--midnight);color:var(--midnight);text-decoration:none;padding:18px 14px;font-size:16px;font-weight:700;transition:background .15s,color .15s;}
  .menu a small{display:block;font-size:12px;font-weight:400;color:#555;margin-top:3px;}
  .menu a .nw{white-space:nowrap;}
  .menu a.podcast{background:#d6ecf7;}
  .menu a:hover,.menu a:active{background:var(--midnight);color:#fff;}
  .menu a:hover small,.menu a:active small{color:var(--breeze);}
  .menu a .arrow{font-size:22px;}
  footer{margin-top:auto;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 24px;}
  footer .plane{width:360px;max-width:70%;height:auto;border-radius:6px;}
  footer .revtbl{border-collapse:collapse;font-size:11px;color:var(--midnight);}
  footer .revtbl th{background:var(--midnight);color:#fff;font-weight:700;padding:4px 12px;text-align:left;}
  footer .revtbl td{padding:3px 12px;border-bottom:1px solid var(--breeze);}
  footer .revtbl tbody tr:nth-child(even){background:var(--ice);}
  footer .revtbl td a{color:var(--atlas);font-weight:700;text-decoration:none;}
  footer .revtbl td a:hover{text-decoration:underline;}
  footer .contact{font-size:11px;color:var(--good);text-decoration:none;}
  footer .ver{width:100%;text-align:right;font-size:11px;font-weight:700;color:var(--good);}
  .gate{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 18px;}
  .gate h2{color:var(--midnight);font-size:22px;margin:0;letter-spacing:.02em;}
  .gate p{color:#555;font-size:13px;margin:0;text-align:center;max-width:420px;line-height:1.5;}
  .gate input{width:100%;max-width:380px;padding:13px 14px;border:2px solid var(--midnight);border-radius:6px;font-size:15px;font-family:inherit;}
  .gate input:focus{outline:none;border-color:var(--atlas);}
  .gate button{background:var(--midnight);color:#fff;border:none;border-radius:6px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;}
  .gate button:hover{background:var(--atlas);}
  .gate .err{color:#C0392B;font-size:13px;font-weight:600;min-height:18px;text-align:center;}
</style>
</head>

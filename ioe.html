<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B787 IOE Workbook Trainer</title>
<style>
:root{
  --midnight:#01426A; --atlas:#0074C8; --green:#00805E; --breeze:#E8F2F9;
  --accent:#b1d887; --amber:#e8a33d; --red:#e0687a;
  --bg:#0b1c2c; --card:#12293d; --line:#1e3d57; --txt:#eaf2f8; --dim:#9ab4c8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--midnight);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:2px solid var(--atlas)}
header h1{font-size:17px;margin:0;flex:1 1 auto;letter-spacing:.2px}
a.btn,button.btn{background:var(--atlas);color:#fff;border:0;border-radius:6px;padding:8px 13px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
a.btn:hover,button.btn:hover{background:#0086e6}
button.btn.ghost{background:transparent;border:1px solid var(--atlas);color:var(--breeze)}
button.btn.on{background:var(--green)}
#bar{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#0e2233;border-bottom:1px solid var(--line)}
select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;max-width:100%}
#main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
.meta{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.coi{background:var(--green);color:#fff;border-radius:4px;padding:2px 7px;font-size:10px;letter-spacing:.5px}
.dsk{background:#3d2438;color:#e8a7d0;border-radius:4px;padding:2px 7px;font-size:10px}
.wlk{background:#2a3550;color:#a9b8e8;border-radius:4px;padding:2px 7px;font-size:10px}
.q{font-size:21px;font-weight:600;margin:0 0 4px;line-height:1.35}
.ans{color:var(--accent);font-weight:600;font-size:18px;line-height:1.45;margin:16px 0 4px}
.src{background:#0a1a27;border-left:3px solid var(--atlas);border-radius:0 8px 8px 0;padding:12px 14px;margin-top:14px;font-size:14px}
.src .ref{color:var(--atlas);font-weight:600;font-size:12.5px;letter-spacing:.3px}
.src blockquote{margin:8px 0;padding-left:11px;border-left:2px solid var(--line);color:var(--breeze);font-style:italic}
.src .note{color:var(--dim);font-size:13px;margin-top:8px}
.src .detail{margin:0 0 10px}
.src .icao{background:#2b2113;border-left:3px solid var(--amber);border-radius:0 6px 6px 0;padding:9px 11px;margin-top:10px;color:#f0d9a8;font-size:13px}
.src .icao b{color:var(--amber);display:block;font-size:11px;letter-spacing:.5px;margin-bottom:4px}
.src .orig{color:var(--dim);font-size:12.5px;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:4px 10px;border-radius:6px;background:var(--green);color:#fff;min-width:56px;text-align:center}
#timer.warn{background:var(--amber)} #timer.crit{background:var(--red)}
#score{font-size:13px;color:var(--dim)}
.hidden{display:none}
footer{text-align:right;padding:14px 18px;color:var(--accent);font-size:11px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.bank{font-size:12px;color:var(--dim);padding:0 16px 10px}
</style>
</head>
<body>
<header>
  <h1>B787 IOE Workbook Trainer</h1>
  <a class="btn ghost" href="index.html">Home</a>
  <a class="btn" id="pdfLink" href="B787_IOE_Workbook_Answered.pdf" target="_blank" rel="noopener">Full Workbook PDF</a>
</header>

<div id="bar">
  <select id="topSel"></select>
  <select id="secSel"></select>
  <select id="filtSel">
    <option value="answered">All drill cards</option>
    <option value="verified">Answered from our manuals</option>
    <option value="desktop">Not in our manuals</option>
    <option value="coi">Critical Observable Items</option>
    <option value="walk">Walkthrough items, perform not recall</option>
  </select>
  <button class="btn ghost" id="modeBtn">Game mode: OFF</button>
  <button class="btn ghost" id="offBtn" title="Keep the cards and the workbook on this device">Save offline</button>
  <span id="timer" class="hidden">20</span>
  <span id="score"></span>
</div>
<div class="bank" id="bankInfo"></div>

<div id="main"><div class="empty">Loading question bank...</div></div>
<footer>Ver 1.7</footer>

<script>
const GAME_SECS=20, BEST_KEY="ioe_best";
let BANK=[], deck=[], idx=0, game=false, revealed=false, t=null, left=GAME_SECS, score=0, played=0;

function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

fetch("ioe_questions.json").catch(()=>caches.match("ioe_questions.json")).then(r=>r.json()).then(d=>{BANK=d;init();})
 .catch(()=>{document.getElementById("main").innerHTML='<div class="card"><p class="q">Question bank not loaded</p><p class="ans">ioe_questions.json is missing from the repo root.</p><p>This page is data-driven and works the moment that file lands beside it. Nothing here needs to change.</p></div>';});

function fill(sel,vals,label){
  sel.innerHTML='<option value="">'+label+'</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v.length>46?v.slice(0,46)+"...":v)}</option>`).join("");
}

function init(){
  fill(document.getElementById("topSel"),[...new Set(BANK.map(b=>b.topic))].sort(),"All topics");
  fill(document.getElementById("secSel"),[...new Set(BANK.map(b=>b.sec+" "+b.secTitle))].sort(),"All workbook sections");
  document.getElementById("topSel").onchange=build;
  document.getElementById("secSel").onchange=build;
  document.getElementById("filtSel").onchange=build;
  document.getElementById("modeBtn").onclick=toggleGame;
  document.getElementById("offBtn").onclick=saveOffline;
  try{if(localStorage.getItem("ioe_offline")){const b=document.getElementById("offBtn");b.textContent="Saved offline";b.classList.add("on");}}catch(e){}
  const v=BANK.filter(b=>b.status==="verified").length,
        d=BANK.filter(b=>b.status==="desktop").length,
        w=BANK.filter(b=>b.kind==="walkthrough").length;
  document.getElementById("bankInfo").textContent=`${BANK.length} workbook questions, ${BANK.length-w} to drill and ${w} walkthrough items you perform rather than recall. ${v} answered from FOM 125.1 / FCOM R10 / QRH R7 with a verbatim quote. ${d} are not answered anywhere in our manuals, and say so.`;
  build();
}

// keep the workbook's gate-to-gate order, but never show the same answer twice in a row
function declump(list){
  const out=[], held=[];
  for(const c of list){
    if(out.length && out[out.length-1].a===c.a){ held.push(c); continue; }
    out.push(c);
    for(let i=0;i<held.length;i++){
      if(out[out.length-1].a!==held[i].a){ out.push(held.splice(i,1)[0]); i--; }
    }
  }
  for(const c of held) out.push(c);
  return out;
}

function build(){
  const top=document.getElementById("topSel").value,
        sec=document.getElementById("secSel").value,
        f=document.getElementById("filtSel").value;
  deck=BANK.filter(b=>{
    if(top&&b.topic!==top)return false;
    if(sec&&(b.sec+" "+b.secTitle)!==sec)return false;
    if(f==="walk")return b.kind==="walkthrough";
    if(b.kind==="walkthrough")return false;
    if(f==="verified")return b.status==="verified";
    if(f==="desktop")return b.status==="desktop";
    if(f==="coi")return !!b.coi;
    return true;});
  deck=declump(deck);
  idx=0; score=0; played=0; render();
}

function toggleGame(){
  game=!game;
  const b=document.getElementById("modeBtn");
  b.textContent="Game mode: "+(game?"ON":"OFF"); b.classList.toggle("on",game);
  document.getElementById("timer").classList.toggle("hidden",!game);
  score=0; played=0; idx=0; render();
}

function stopTimer(){ if(t){clearInterval(t);t=null;} }

function startTimer(){
  stopTimer(); left=GAME_SECS; paint();
  t=setInterval(()=>{ left--; paint(); if(left<=0){ stopTimer(); reveal(); } },1000);
}
function paint(){
  const el=document.getElementById("timer"); el.textContent=left;
  el.className=""; if(left<GAME_SECS*0.22) el.classList.add("crit");
  else if(left<GAME_SECS*0.5) el.classList.add("warn");
}

function render(){
  const m=document.getElementById("main");
  stopTimer(); revealed=false;
  if(!deck.length){ m.innerHTML='<div class="empty">No cards match this filter.</div>'; document.getElementById("score").textContent=""; return; }
  if(idx>=deck.length){
    const pct=played?Math.round(score/played*100):0;
    let best=0; try{best=+(localStorage.getItem(BEST_KEY)||0);}catch(e){}
    if(game && pct>best){ try{localStorage.setItem(BEST_KEY,pct);}catch(e){} best=pct; }
    m.innerHTML=`<div class="card"><div class="q">Deck complete</div>
      <p class="ans">${game?`Scored ${score} of ${played} (${pct}%)`:"Reviewed "+deck.length+" cards"}</p>
      ${game?`<p>Best: ${best}%</p>`:""}
      <div class="row"><button class="btn" onclick="idx=0;score=0;played=0;render()">Run again</button></div></div>`;
    document.getElementById("score").textContent=""; return;
  }
  const c=deck[idx];
  const tags=[`${esc(c.topic)}`, c.coi?'<span class="coi">CRITICAL OBSERVABLE</span>':"",
    c.kind==="walkthrough"?'<span class="wlk">WALKTHROUGH</span>':"",
    c.status==="desktop"?'<span class="dsk">NOT IN OUR MANUALS</span>':""].filter(Boolean).join(" ");
  m.innerHTML=`<div class="card">
    <div class="meta">${tags} <span>${idx+1} / ${deck.length}</span></div>
    <p class="q">${esc(c.q)}</p>
    <div class="meta">${esc(c.sec)} ${esc(c.secTitle)}${c.group?" &middot; "+esc(c.group):""}</div>
    <div id="ansWrap" class="hidden"></div>
    <div id="srcWrap" class="hidden"></div>
    <div class="row" id="ctl"></div></div>`;
  document.getElementById("ctl").innerHTML=`<button class="btn" onclick="reveal()">Reveal</button>
    <button class="btn ghost" onclick="next()">Skip</button>`;
  document.getElementById("score").textContent=game?`Score ${score}/${played}`:"";
  if(game) startTimer();
}

function reveal(){
  if(revealed) return; revealed=true; stopTimer();
  const c=deck[idx], w=document.getElementById("ansWrap");
  w.innerHTML=`<p class="ans">${esc(c.a)}</p>`;
  w.classList.remove("hidden");
  document.getElementById("ctl").innerHTML =
    `<button class="btn ghost" onclick="showSrc()">Source</button>` + (game
    ? `<button class="btn" onclick="mark(1)">Nailed it</button><button class="btn ghost" onclick="mark(0)">Missed</button>`
    : `<button class="btn" onclick="next()">Next</button>`);
}

function showSrc(){
  const c=deck[idx], w=document.getElementById("srcWrap");
  if(!w.classList.contains("hidden")){ w.classList.add("hidden"); return; }
  w.innerHTML=`<div class="src">
    ${c.detail?`<p class="detail">${esc(c.detail)}</p>`:""}
    <div class="ref">${esc(c.ref)}</div>
    ${c.quote?`<blockquote>${esc(c.quote)}</blockquote>`:""}
    ${c.note?`<div class="note">${esc(c.note)}</div>`:""}
    ${c.icao?`<div class="icao"><b>NAT DOC 007, REFERENCE ONLY. COMPANY PROCEDURE GOVERNS</b>${esc(c.icao)}</div>`:""}
    ${c.qOrig&&c.qOrig!==c.q?`<p class="orig">Workbook wording: ${esc(c.qOrig)}</p>`:""}
  </div>`;
  w.classList.remove("hidden");
}

async function saveOffline(){
  const b=document.getElementById("offBtn");
  if(!("caches" in window)){ b.textContent="Not supported"; return; }
  b.textContent="Saving...";
  try{
    const c=await caches.open("ioe-offline-v1");
    await c.addAll(["ioe.html","ioe_questions.json","B787_IOE_Workbook_Answered.pdf"]);
    b.textContent="Saved offline"; b.classList.add("on");
    try{localStorage.setItem("ioe_offline","1");}catch(e){}
  }catch(e){ b.textContent="Save failed"; }
}

function mark(ok){ played++; if(ok) score++; next(); }
function next(){ idx++; render(); }
</script>
</body>
</html>

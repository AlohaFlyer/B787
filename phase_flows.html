<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B787 Flows">
<title>B787 Phase Flows</title>
<style>
:root{
  --blue:#0074C8;--say:#c0392b;--trig:#e8590c;--cl:#7b2fb0;
  --bg:#eef4f8;--card:#ffffff;--ink:#15314a;--muted:#5c728a;--line:#e6edf3;
  --head:#01426A;--nav:#dfe8f0;--navbtn:#ffffff;--navink:#01426A;--accent:#01426A;
  --limbg:#fff1c4;--limink:#7a5600;--qbg:#f1f6fb;
}
body.dark{
  --bg:#0d1620;--card:#15212d;--ink:#e7eff7;--muted:#9bb1c4;--line:#26384a;
  --head:#06243a;--nav:#101c28;--navbtn:#1b2a38;--navink:#cfe0ee;--accent:#3a93d8;
  --limbg:#46380e;--limink:#ffd86b;--qbg:#0f1d29;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Helvetica Neue',-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg);
display:flex;flex-direction:column;height:100vh;overflow:hidden;}
header{background:var(--head);color:#fff;
padding:calc(6px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));
display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;flex:none;}
.hleft{display:flex;align-items:center;gap:10px;min-width:0;}
.back{display:inline-flex;align-items:center;gap:4px;color:#eaf3fb;font-weight:800;font-size:12.5px;
text-decoration:none;background:rgba(255,255,255,.16);padding:7px 11px;border-radius:8px;white-space:nowrap;}
.back:active{background:rgba(255,255,255,.28);}
header .ttl{font-size:17px;font-weight:800;letter-spacing:.3px;}
header .sub{font-size:10px;color:#bcd6ec;font-weight:600;margin-top:1px;}
.ctrls{display:flex;gap:8px;align-items:center;}
.toggle{display:flex;border-radius:8px;padding:3px;gap:2px;}
.toggle.seat{background:rgba(0,0,0,.28);}
.toggle.duty{background:rgba(0,45,33,.5);}
.toggle button{border:0;background:transparent;color:#bcd6ec;font-weight:800;font-size:14px;
padding:8px 17px;border-radius:6px;cursor:pointer;letter-spacing:.3px;}
.toggle.seat button.on{background:#fff;color:#01426A;}
.toggle.duty button{color:#9fe0cd;}
.toggle.duty button.on{background:#37d9a8;color:#053b2c;}
.themebtn{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:17px;width:40px;height:40px;
border-radius:8px;cursor:pointer;}
.filt{width:auto;min-width:56px;padding:0 12px;font-size:12.5px;font-weight:800;letter-spacing:.4px;height:40px;}
.filt.on{background:#37d9a8;color:#053b2c;}
.gate{flex:none;display:flex;align-items:center;gap:10px;background:var(--cl);color:#fff;padding:6px calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));}
.gate .lbl{font-size:10px;opacity:.85;font-weight:800;letter-spacing:.5px;}
.gate .nm{font-size:14.5px;font-weight:800;letter-spacing:.2px;}
.gate.none{display:none;}
main{flex:1;overflow:auto;padding:10px 12px 8px;display:flex;flex-direction:column;min-height:0;}
.phasehead{font-size:1.15em;font-weight:800;color:var(--ink);margin:0 2px 8px;display:flex;
align-items:baseline;gap:10px;flex-wrap:wrap;flex:none;}
.phasehead .src{font-size:.7em;font-weight:600;color:var(--muted);}
.grid{font-size:15px;column-gap:11px;flex:1;min-height:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;
margin:0 0 11px;display:block;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.05);
break-inside:auto;-webkit-column-break-inside:auto;}
.card .ch{border-radius:8px 8px 0 0;break-inside:avoid;break-after:avoid;}
.cb{break-before:avoid;}
.it,.trig,.cl,.clwrap,.book,.sub,.note{break-inside:avoid;-webkit-column-break-inside:avoid;}
.card .ch{background:var(--head);color:#fff;font-weight:800;font-size:.85em;letter-spacing:.3px;
display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:6px solid var(--ec,#888);}
.card .ch .hn{padding:6px 0 6px 9px;}
.cardcite{font-size:.62em;font-weight:600;opacity:.82;white-space:nowrap;letter-spacing:.2px;padding-right:9px;}
.cb{padding:5px 9px 7px;}
.it{display:flex;gap:7px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--line);}
.it:first-child{border-top:none;}
.stepn{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--line);color:var(--muted);
font-size:.62em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:.2em;}
.it .body{flex:1;min-width:0;}
.it .t{font-weight:800;font-size:.85em;}
.it .s{font-size:.78em;color:var(--muted);margin-top:1px;}
.it.fmc .stepn{background:#d7e9fb;color:#1d63b0;}.it.fmc .t{color:var(--blue);}
.it.say .t{color:var(--say);}
.sayb{color:var(--say);font-weight:800;margin-right:3px;}
.it.say .stepn{background:#fbdcd7;color:var(--say);}
.it.dim{opacity:.32;}
.rtag{display:inline-block;font-size:.62em;font-weight:800;color:#fff;border-radius:7px;
padding:1px 5px;margin-left:6px;vertical-align:middle;}
.rtag.C{background:#01426A;}.rtag.F{background:#0a8fb0;}.rtag.PF{background:#00805E;}.rtag.PM{background:#5f3dc4;}
.lim{background:var(--limbg);color:var(--limink);font-weight:800;border-radius:3px;padding:0 3px;}
.trig{display:flex;gap:8px;align-items:center;background:rgba(232,89,12,.13);border:1px solid rgba(232,89,12,.4);
border-left:5px solid var(--trig);color:var(--trig);font-weight:800;border-radius:6px;
padding:6px 9px;margin:5px 0;font-size:.85em;}
.trig .ic{font-size:1.05em;flex:none;}
.cl{display:flex;gap:9px;align-items:center;background:rgba(123,47,176,.13);border:1px solid rgba(123,47,176,.42);
border-left:6px solid var(--cl);color:var(--cl);font-weight:800;border-radius:6px;
padding:8px 10px;margin:6px 0;font-size:.92em;}
.cl.bold{background:rgba(123,47,176,.22);}
.cl .ic{font-size:1.1em;flex:none;}
.cl .w{display:block;color:var(--muted);font-style:italic;font-weight:600;font-size:.68em;margin-top:1px;}
.book{background:rgba(120,130,140,.1);border-left:5px solid #6b7280;border-radius:6px;padding:5px 9px;margin:5px 0;}
.book .t{font-weight:800;font-size:.85em;}.book .s{font-size:.78em;color:var(--muted);margin-top:1px;}
.sub{color:#fff;font-weight:800;font-size:.72em;padding:3px 8px;border-radius:5px;margin:7px 0 3px;letter-spacing:.3px;}
.note{font-size:.78em;color:var(--muted);font-style:italic;margin:3px 0;padding-left:2px;}
.it.has-q{cursor:pointer;}
.qbox{display:none;margin:5px 0 2px;padding:7px 9px;background:var(--qbg);border:1px solid var(--line);
border-left:4px solid var(--accent);border-radius:5px;font-size:.78em;color:var(--ink);line-height:1.38;}
.it.open .qbox{display:block;}
.qbox .qsrc{display:block;font-weight:800;color:var(--accent);font-size:1em;margin-bottom:3px;letter-spacing:.2px;}
.qbox .qt{font-style:italic;}
.empty{color:var(--muted);font-style:italic;padding:20px;}
nav{flex:none;background:var(--nav);border-top:1px solid var(--line);position:relative;
padding:7px calc(8px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;white-space:nowrap;display:flex;gap:6px;align-items:stretch;
scroll-behavior:smooth;touch-action:pan-x;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
.npag{position:sticky;flex:none;align-self:stretch;width:38px;min-width:38px;border:0;cursor:pointer;padding:0;
background:var(--nav);color:var(--head);font-size:23px;font-weight:900;z-index:6;display:flex;align-items:center;justify-content:center;}
.npag.l{left:0;box-shadow:8px 0 10px -4px rgba(0,0,0,.3);border-radius:0 10px 10px 0;}
.npag.r{right:0;box-shadow:-8px 0 10px -4px rgba(0,0,0,.3);border-radius:10px 0 0 10px;}
.npag.gone{display:none;}
.navlabel{font-size:9px;font-weight:800;color:var(--muted);align-self:center;margin-right:2px;letter-spacing:.4px;}
nav .divider{width:2px;background:var(--line);margin:0 5px;border-radius:2px;}
nav button{flex:none;border:1.5px solid transparent;background:var(--navbtn);color:var(--navink);font-weight:800;
font-size:13px;padding:9px 14px;border-radius:18px;cursor:pointer;letter-spacing:.2px;}
nav button.ab{color:var(--say);}
nav button.on{background:var(--head);color:#fff;}
nav button.ab.on{background:var(--say);color:#fff;}
.arrow{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:60px;border:0;cursor:pointer;
background:var(--head);color:#fff;font-size:26px;font-weight:800;z-index:30;opacity:.85;
box-shadow:0 2px 7px rgba(0,0,0,.3);}
.arrow.prev{left:env(safe-area-inset-left);border-radius:0 10px 10px 0;}.arrow.next{right:env(safe-area-inset-right);border-radius:10px 0 0 10px;}
.morecue{position:fixed;z-index:24;width:42px;pointer-events:none;display:none;}
.morecue.show{display:none;}
.morecue.r{background:linear-gradient(to right,rgba(127,127,127,0),rgba(127,127,127,.22));}
.morecue.l{background:linear-gradient(to left,rgba(127,127,127,0),rgba(127,127,127,.22));}
.morecue .chev{position:absolute;top:14%;width:30px;height:30px;border-radius:50%;background:var(--accent);
color:#fff;font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.35);}
.morecue.r .chev{right:5px;animation:cueR 1.3s ease-in-out infinite;}
.morecue.l .chev{left:5px;animation:cueL 1.3s ease-in-out infinite;}
@keyframes cueR{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes cueL{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.apprwrap{display:flex;gap:8px;align-items:center;}
.toggle.appr{background:rgba(120,70,0,.45);}
.toggle.appr button{color:#f3d4a2;}
.toggle.appr button.on{background:#e8a13a;color:#3a2400;}
.toggle.cat{background:rgba(120,70,0,.3);}
.toggle.cat button{color:#f3d4a2;padding:8px 13px;}
.toggle.cat button.on{background:#f3c477;color:#3a2400;}
ul.bl{margin:2px 0 0;padding:0;list-style:none;}
ul.bl li{font-size:.78em;color:var(--muted);line-height:1.28;padding-left:13px;position:relative;margin:1.5px 0;}
ul.bl li::before{content:'•';position:absolute;left:3px;color:var(--accent);font-weight:800;}
ul.bl li b{color:var(--ink);} .co{color:var(--say);}
    ul.bl ul.sub{list-style:none;margin:2px 0 3px 12px;padding:0;} ul.bl ul.sub li{position:relative;padding-left:12px;font-size:13px;font-weight:400;} ul.bl ul.sub li::before{content:"–";position:absolute;left:0;opacity:.65;}
.exp{display:inline-block;color:var(--accent);font-size:.62em;font-weight:800;margin-left:6px;
border:1.4px solid var(--accent);border-radius:5px;padding:0 5px;vertical-align:middle;opacity:.85;}
.it.open .exp,.clwrap.open .exp{background:var(--accent);color:#fff;}
.clwrap{margin:6px 0;}
.cl.has-cl{cursor:pointer;margin:0;}
.cl .cln{flex:1;}
.clbody{display:none;border:1px solid rgba(123,47,176,.32);border-top:0;border-radius:0 0 7px 7px;
background:var(--card);padding:3px 9px 6px;}
.clwrap.open .clbody{display:block;}
.cli{display:flex;align-items:baseline;gap:7px;font-size:.78em;padding:3px 0;border-top:1px solid var(--line);}
.cli:first-child{border-top:0;}
.cli .cii{font-weight:800;color:var(--ink);}
.cli .civ{flex:1;color:var(--muted);}
.cli.dim{opacity:.32;}
/* compact mode: hide verbose detail on dense phases (keep callouts + open items) */
.grid.compact .it:not(.say):not(.open) .s,
.grid.compact .it:not(.say):not(.open) ul.bl,
.grid.compact .note{display:none;}
.rail{display:none;}
.rail .navlabel{display:block;margin:7px 4px 3px;}
.rail button{flex:none;border:1.5px solid transparent;background:var(--navbtn);color:var(--navink);
font-weight:800;font-size:13.5px;padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;width:100%;letter-spacing:.2px;}
.rail button.ab{color:var(--say);}
.rail button.on{background:var(--head);color:#fff;}
.rail button.ab.on{background:var(--say);color:#fff;}
.rail{display:none !important;}

.notesbtn{width:auto;min-width:60px;padding:0 12px;font-size:11px;font-weight:800;letter-spacing:.3px;
height:40px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;cursor:pointer;}
.notesbtn.on{background:#37d9a8;color:#053b2c;}
ol.cl-order{margin:2px 0 0;padding-left:20px;}
ol.cl-order li{font-size:.85em;font-weight:700;color:var(--ink);padding:3px 0;border-bottom:1px solid var(--line);}
ol.cl-order li:last-child{border-bottom:none;}
.grid.notesmode{cursor:pointer;}
</style>
</head>
<body>
<header>
  <div class="hleft">
    <a class="back" href="index.html" title="Study Portal">&#9664; Portal</a>
    <div class="htitle">
      <div class="ttl">B787 Phase Flows</div>
      <div class="sub" id="srcsub"></div>
    </div>
  </div>
  <div class="ctrls">
    <button class="notesbtn" id="notesBtn" title="Quick Reference Notes">NOTES</button>
    <div class="toggle seat" id="seat">
      <button data-s="C" class="on">CA</button>
      <button data-s="F">FO</button>
    </div>
    <div class="toggle duty" id="duty">
      <button data-d="PF" class="on">PF</button>
      <button data-d="PM">PM</button>
    </div>
    <div class="apprwrap" id="apprwrap" style="display:none">
      <div class="toggle appr" id="appr">
        <button data-a="ILS" class="on">ILS</button>
        <button data-a="IAN">IAN</button>
        <button data-a="RNPAR">RNP&nbsp;AR</button>
      </div>
      <div class="toggle cat" id="cat">
        <button data-c="1" class="on">I</button>
        <button data-c="2">II</button>
        <button data-c="3">III</button>
      </div>
    </div>
    <button class="themebtn filt" id="filt" title="Show or hide the other crew member's steps">BOTH</button>
    <button class="themebtn" id="theme" title="Day / Night">&#9790;</button>
  </div>
</header>

<div class="gate" id="gate"></div>
<main id="main"></main>
<nav id="nav"></nav>
<nav id="rail" class="rail"></nav>
<button class="arrow prev" id="prev" aria-label="Previous phase">&#8249;</button>
<button class="arrow next" id="next" aria-label="Next phase">&#8250;</button>
<div class="morecue l" id="cueL"><span class="chev">&#8249;</span></div>
<div class="morecue r" id="cueR"><span class="chev">&#8250;</span></div>

<script>
const box=(t,s,r,call,q)=>({k:'box',t,s:s||'',r:r||'B',call:!!call,q:q||''});
const fmc=(t,s,r,q)=>({k:'box',t,s:s||'',r:r||'B',fmc:true,q:q||''});
const sub=(t,c)=>({k:'sub',t,c});
const trig=(t,r)=>({k:'trig',t,r:r||'B'});
const cl=(t,w,bold)=>({k:'cl',t,w:w||'',bold:!!bold});
const book=(t,s)=>({k:'book',t,s:s||''});
const note=(t)=>({k:'note',t});
const S=(h,c,items,cite,appr)=>({h,c,items,cite:cite||'',appr:appr||'all'});

const PHASES=[
{id:'preflight',label:'Preflight',kind:'n',title:'PREFLIGHT',src:'FCOM NP.21.1-27 · PRC',sections:[
  S('COCKPIT ENTRY','#334e68',[
    box('ARRS · FFLAAP MD · Logbook','ARRS: certs/docs aboard & valid (3) » Airworthiness ; Registration ; Radio license · FFLAAP MD: (18) » 2 Flashlights ; 1 Fire Ext ; 4 Life Vests ; 1 AVSAX & Gloves ; 1 Crash Axe ; 1 PBE ; 4 O2 Masks ; 4 Descent Devices · Logbook: awake, or cold & dark?','B'),
    box('DEAD AIRCRAFT - Elec Pwr Up (Read & Do)','Batt On · Hyd Pumps Off · Wipers Off · Gear Lever Dn · Alt Flap Swts Off · External/APU On (SP.6)','B'),
    box('Prelim Preflt Flow (CA or FO)','(I SEE HOP) Logbook · IRS, Status, EICAS, Eng oil, Hyd, O2, Park Brk · Gnd Air? (NP.21.1)','B',true,'IRS selectors ... OFF 30 seconds, then ON (verify ON BAT light extinguished). STATUS display ... Check - verify that only expected messages are shown. Verify sufficient for flight: Oxygen pressure, Hydraulic quantity, Engine oil quantity. EICAS display ... Check - verify only expected alert and memo messages are shown. Parking brake ... Set.'),
    trig('Park brake SET → PF begins CDU setup / PM walk-around','B'),
  ],'FCOM NP.21.1 · SP.6'),
  S('D-ATIS / FLIGHT INFO','#0a6c8f',[
    book('D-ATIS (press COMM)','FLIGHT INFORMATION > ATIS REQUEST · verify altimeter numeric = alpha · SP.5.1'),
  ],'FCOM SP.5.1'),
  S('CDU PREFLIGHT (PF) · NP.21.2-5','#01426A',[
    note('Initial + Nav Data complete before flight-instrument check'),
    sub('1 - INITIAL DATA','#0074C8'),
    fmc('IDENT','MODEL, ENG RATING, cycle NAV database','PF','CDU IDENT page: Verify that the MODEL is correct. Verify that the ENG RATING is correct. Cycle the active NAV database to erase all previously pilot-entered data. Verify that the navigation database ACTIVE date range is current.'),
    fmc('POS INIT','time; set inertial pos if boxed'),
    sub('2 - NAV DATA','#00805E'),
    fmc('RTE','FLT NO, ROUTE REQUEST, LOAD, ACTIVATE/EXEC'),
    fmc('DEPARTURES','runway / HUD TKOF, dep routing, EXEC'),
    fmc('POS REF 2','verify departure RNP'),
    fmc('ARRIVALS','runway + arrival; no approach yet'),
    fmc('FIX INFO','ETPs; 410 NM EEP circle (ETOPS)'),
    fmc('NAV RADIO','tune nav radios as needed (EO departure / escape navaids)'),
    sub('3 - PERF DATA','#E0A100'),
    note('Perf Data complete before Before-Start Checklist'),
    fmc('PERF INIT','ZFW · FUEL check (CDU=Release=EICAS) · RESERVES · CRZ ALT · COST INDEX · STEP 0','PF','If PERF INIT DATA is available: Select ACCEPT. Verify/enter the planned ZFW. Verify that the FUEL on the CDU, the Dispatch Release, and EICAS agree. Verify that the fuel is sufficient for flight. Verify/enter RESERVES (sum of hold and alternate). Verify/enter CRZ ALT. Verify/enter COST INDEX. Enter STEP SIZE 0.'),
    sub('4 - WIND DATA','#0a8fb0'),
    fmc('FMC COMM','WIND + DES + CLB forecasts, LOAD'),
    sub('5 - LEGS VERIFICATION','#5A4AB7'),
    fmc('LEGS','crosscheck legs vs flight plan'),
    fmc('NAV DATA','INIT REF>INDEX>NAV DATA: paste wpt, compare LAT/LONG (ORCN/ETOPS dual)'),
    sub('6 - REGISTER','#01426A'),
    fmc('OPS CONTROL (COMPANY-FLIGHT INIT)','FLT NO · DATE (numeric day) · ORIG/DEST stations · CAPT/FO/RO IDs'),
    box('COMM-ATC: Logon (CA or FO)','LOGON TO KUSA (KSEA/CONUS Data Comm) · PHNL = PDC · auto-upload 30 min prior','B',true),
    book('REQUEST - Preliminary Performance (datalink)','for AeroData final perf · do not load FMS · need not print'),
  ]),
  S('ORCN / ETOPS PREFLIGHT (PRC)','#0a6c8f',[
    box('Verify','MELs/CDLs affecting RNP / comms / ETOPS capability · Dispatch Release ETOPS status · critical-fuel analysis','B'),
    box('Alternates','ETOPS alternate weather + NOTAMs · load flight plan in FD Pro · PDSC/PDC complete & valid','B'),
    box('Program','EEP / EXP and ETP / CP per aircraft procedures · oceanic route verification (expanded lat/long)','B'),
    box('HF','locate HF freqs + perform HF radio check (WWV/WWVH or VOLMET)','B'),
  ],'PRC ORCN/ETOPS Card'),
  S('PREFLIGHT COMPLETION','#2e7d5b',[
    box('PM: Walk-around / Exterior Inspection','typically right after Preliminary Preflight (NP.21.6)','PM'),
    box('CA flow (glareshield / forward)','EFIS · Display Select · MCP · Oxygen test · brightness · Air Data/Att · PFD/MFD · do Initial+Nav Data, verify IRS · Flight instruments + standby','C',false,'Preflight Procedure - CA: EFIS control panel Set (minimums, baro, ND MAP). Display select panel Set. Mode control panel Set (FD ON, A/T ARM, AP disengage bar UP, bank limit AUTO). Oxygen Test and set, mask 100%. Forward / inboard / outboard brightness Mid. AIR DATA/ATTITUDE AUTO, PFD/MFD NORM. Do the Initial and Nav Data from the CDU and verify IRS alignment, then Flight instruments Check. Integrated standby flight display Set. (FCOM NP.21.22-24)'),
    box('CA Lower Waterfall','Speedbrake/Thrust/Flap levers · Parking brake · Stab cutout · Fuel Control CUTOFF · Alt Flaps · WXR/XPDR/VHF · seat + rudder pedals · headset · HUD','C',false,'CA Lower Waterfall (down the aft pedestal/lower panel): Speedbrake DOWN, reverse + forward thrust levers Down/Closed, flap lever Set. Parking brake Set. Stabilizer cutout switches guards closed. FUEL CONTROL switches CUTOFF. Alternate Flaps panel Set (ARM Off, selector OFF). Left tuning and control panel: Weather Radar, Transponder, VHF. Audio control panel as needed. Seat and rudder pedals Adjust. Headset On. HUD combiner Down. Seat belt and harness Adjust. Call PREFLIGHT CHECKLIST. (FCOM NP.21.24-25)'),
    box('FO preflight flow (overhead waterfall)','Flight Control Surfaces · Heading Ref · PFC Disc · Electrical (Batt/IFE/Cabin/APU GEN/GEN CTRL) · APU · FD Door Power · Emer Lights · Window Heat · RAT · Hydraulic pumps · Seat Belts · Lighting · Ground Test · APU/Cargo fire · Engine (EEC/START) · Fuel Jettison · Fuel · Anti-ice','F',false,'Preflight Procedure - FO (overhead panel, top to bottom): FLIGHT CONTROL SURFACES (TAIL/WINGS NORM). HEADING REFERENCE NORM. PFC DISCONNECT guard closed. ELECTRICAL: BATTERY ON, IFE/PASS SEATS ON, CABIN/UTILITY ON, APU GENERATOR switches ON, GENERATOR CONTROL switches ON. APU selector START then ON as needed. L HUD BRIGHTNESS In, L WIPER OFF. FLIGHT DECK DOOR POWER ON. CCR RESET / EMERGENCY LIGHTS guards closed. SERVICE INTERPHONE OFF. WINDOW HEAT BACKUP + PRIMARY ON. RAM AIR TURBINE - do not push. HYDRAULIC: ENGINE PRIMARY pumps ON, CENTER + DEMAND pumps OFF. SEAT BELTS Set. Lighting panel Set. GROUND TEST NORM. APU and CARGO FIRE panels Set. ENGINE panel (EEC MODE NORM, START selectors NORM). FUEL JETTISON Set. FUEL panel (CROSSFEED OFF, pumps OFF). ANTI-ICE Set. (FCOM NP.21.12)'),
    trig('HUD stowed/down = ready for checklist','B'),
    cl('Preflight','cockpit preflight complete'),
    trig('After Preflight Checklist → 3 items “C.R.B.”: Clearance · Route · Brief (crew gouge)','B'),
    box('C - Clearance (ATC / Departure)','FO obtains · Domestic = KUSA · HNL = Comm-Flt Info, Dept Clnc Req','F',false,'Departure Clearance ... Obtain (FO). (FCOM NP.21.26)'),
    box('MCP (takeoff pilot)','V2 · HDG/TRK · ALTITUDE · arm VNAV (LNAV as needed)','PF'),
    box('R - Route (Joint Verbal FMC Route Check)','PF reads ATC clearance · PM crosschecks vs FMC RTE pages + flight plan · PF reads dist + fuel over dest (PROG 1/4), PM crosschecks','B',false,'PF reads the ATC clearance while the PM crosschecks against the FMC RTE pages and flight plan. PF reads the total distance and fuel over destination from PROG 1/4 while the PM crosschecks against the flight plan. (FCOM NP.21.26)'),
    box('B - Brief (Takeoff Brief)','Flaps, A/T, CG, V-Spds, Accel/Thrust hts · SID, Threats · Arm VNAV, LNAV?','B',false,'Taxi and Takeoff briefings - Complete (CA, FO). The pilot who will do the takeoff does the taxi and takeoff briefings. (FCOM NP.21.26)'),
  ],'FCOM NP.21.22-26'),
  S('PERFORMANCE / TAKEOFF DATA','#b8860b',[
    trig('“The 4” before the Before Start Checklist: Performance · T/O Data · TPR · Load Closeout (crew gouge)','B'),
    box('1 - Performance','COMPANY-PERFORMANCE-TAKEOFF DATA: LOAD FMC · PERF INIT ACCEPT (verify ZFW)','PF',false,'COMPANY-PERFORMANCE-TAKEOFF DATA page: Select LOAD FMC. CDU PERF INIT: Select ACCEPT, verify ZFW. (FCOM NP.21.27; the “Performance” item label is crew gouge)'),
    box('2 - T/O Data','TAKEOFF REF 1/2: flaps, assumed temp, CG, V1/VR/V2 · set MCP V2 · TAKEOFF REF 2/2: accel hts, thr reduction · THRUST LIM (no TO 1/TO 2)','PF',false,'CDU TAKEOFF REF 1/2: ACCEPT; verify/enter FLAPS, assumed temperature (THRUST), takeoff CG, and V1/VR/V2; set MCP IAS/MACH to V2. TAKEOFF REF 2/2: verify EO ACCEL HT, ACCEL HT, THR REDUCTION. THRUST LIM: verify OAT, select TO and CLB limits (HA operations do not allow TO 1 or TO 2). (FCOM NP.21.27; the “T/O Data” item label is crew gouge)'),

    box('4 - Load Closeout (LCO Verification)','FO reads Flight #, UTC date, Tail #, Takeoff Weight from Load Closeout · CA verifies vs Dispatch Release','B',false,'The FO reads from the Load Closeout, and CA verifies against the Dispatch Release, the following values: Flight number, UTC date, Tail number, Takeoff Weight (refer to FOM Dispatch Release Weight Tolerances). (FCOM NP.21.27)'),

{id:'before-start',label:'Before Start',kind:'n',title:'PUSH & START',src:'FCOM NP.21.26-30',sections:[
  S('PUSH & START','#7a3b8f',[
    trig('Ground calls CA: “Walkaround checks complete” → CA: “STANDBY” → cues FO Before Start flow','B'),
    box('Before Start Flow (FO)','FWD CARGO FLOW set · Flt deck door closed/locked · Exterior doors closed · Nose gear steering locked out (if pushback) · Hyd pumps AUTO · Fuel pumps ON · BEACON ON · CANCEL/RECALL · Trim SET (CA)','F',false,'FWD CARGO FLOW ... Set (HIGH for live animals/odorous cargo, otherwise LOW). Continue once cabin secure and walkaround complete (walkaround complete = clearance to pressurize hydraulics). Flight deck door ... Closed and locked. Exterior doors ... Verify closed. If pushback: Nose gear steering ... Verify locked out. HYDRAULIC panel ... Set (demand + center pumps AUTO). Fuel panel ... LEFT/RIGHT FUEL PUMP switches ON. BEACON ... ON. CANCEL/RECALL ... Push (verify only expected messages). Trim ... Set (greenband). (FCOM NP.21.28-29)'),
    trig('CA calls the Before Start Checklist after “the 4” are done: Performance · T/O Data · TPR · Load Closeout','B'),
    cl('Before Start','before-start flow complete; CA calls'),
    box('CA','Brakes set · Clr to disconnect External/Air? · Stby for Push Clnc','C',true),
    box('Ramp Crew','Gnd→Flt Dk confirm brakes set? · Disconnect Ext/Air? · “Ready for Push”','C',true),
    box('Call ATC for Push Clearance','','C',true),
    box('Push','Ramp: “Clear to release brakes?” → CA releases parking brake · pushback begins','C',true,'Parking brake ... Set or release as directed by ground handling personnel (CA). CAUTION: Do not turn the nose wheel tiller during pushback or towing. CAUTION: Do not use airplane brakes to stop the airplane during pushback or towing. (FCOM NP.21.30)'),
    box('Start clearance (during push)','CA receives clearance to start engines','C',true,'Start clearance ... Obtain (CA). Start sequence ... Announce (CA). The Engine Start procedure may be done during pushback or towing. (FCOM NP.21.30)'),
    box('CA start-count decision','oil temp above -40°C AND OAT 40°C or below → tell ground “starting 2 engines” · hotter than 40°C OAT → start one at a time','C',true,'Crew SOP decision gate built from two source limits: # For engine start, oil temperature must be greater than -40 degrees C (FCOM L.10.8). CAUTION: If OAT is above 40°C, do not attempt to start both engines at the same time (FCOM NP.21.30). If both gates pass, CA advises the ground crew that both engines will be started together; otherwise start one at a time.'),
    box('Engine Start','engines may be started at the same time · “START ___ ENGINE”','B',false,'CAUTION: If OAT is above 40°C, do not attempt to start both engines at the same time. Note: The engines may not start if external power and the APU are both supplying electric power at the same time - one source must be selected off; the APU is the preferred source for engine start. (FCOM NP.21.30)'),
    box('Push complete','Ramp: “Clear to set brakes” → CA sets parking brake · CA: “Clear to disconnect, go to hand signals”','C',true,'When pushback or towing is complete: Tow bar ... Verify not connected (CA). Nose gear steering ... Verify not locked out (CA). (FCOM NP.21.30) The disconnect / hand-signals exchange is crew SOP.'),
    trig('Pin shown + salute at the side → CA acknowledges ramp with the TAXI light → taxi flow (crew SOP)','C'),
  ]),
]},

/* ============================================================
   MAINTENANCE: to fold in a new manual revision, edit (1) VERSIONS
   below, (2) the affected items in the PHASES data above, and
   (3) the per-card cite / per-step quote. Nothing else changes.

const VERSIONS='FCOM R10 · QRH R7 · FCTM R9 · FOM 124.2 · PRC 04/01/26 · v0.3';
document.getElementById('srcsub').textContent=VERSIONS;
const QUOTES={"preflight|ARRS · FFLAAP MD · Logbook":"ARRS: personal walk-in mnemonic for checking the aircraft's required certificates / documents are aboard and valid (Airworthiness certificate, Registration, Radio station license). FFLAAP MD: flight-deck emergency equipment check - 2 Flashlights, 1 Fire Extinguisher, 4 Life Vests, 1 AVSAX & Gloves, 1 Crash Axe, 1 PBE, 4 O2 Masks, 4 Descent Devices. Then the Logbook (is the airplane awake or cold and dark?). Crew memory aids, not a published FCOM step list. (HAL B787 GenOps notes)","preflight|DEAD AIRCRAFT - Elec Pwr Up (Read & Do)":"Electrical Power Up: BATTERY switch ON. C1 and C2 ELEC pump selectors OFF. DEMAND pump selectors OFF. WIPER selectors OFF. Landing gear lever DN. ALTN FLAPS selector OFF. Electrical power Establish (external power if desired, otherwise APU). (FCOM SP.6.2)","preflight|COMM-ATC: Logon (CA or FO)":"KSEA / CONUS Data Comm: log on with LOGON TO = KUSA to enable departure-clearance auto-upload approximately 30 minutes prior. PHNL uses a PDC rather than a CPDLC logon. (Company Data Comm procedure)","preflight|POS INIT":"CDU POS INIT page: Verify that the time is correct. If SET INERTIAL POS line is boxed, enter the present position on the SET INERTIAL POS line using the most accurate latitude and longitude. (FCOM NP.21.2)","preflight|RTE":"CDU RTE page: Enter FLT NO exactly as it appears on the Dispatch Release and select ROUTE REQUEST. Once ROUTE UPLINK appears, select LOAD. Verify/enter ORIGIN and DEST airport. Verify/enter the route. ACTIVATE and execute RTE 1. (FCOM NP.21.2)","preflight|DEPARTURES":"CDU DEPARTURES page: Select the runway or HUD TAKEOFF. Select departure routing. Execute the runway/HUD TAKEOFF and departure routing. Note: if a change in HUD TAKEOFF runway is needed, select both flight director switches OFF; after the new runway is executed, select the FD switches back ON. (FCOM NP.21.3)","preflight|POS REF 2":"POS REF page 2: Verify the correct RNP for the departure, as needed. (FCOM NP.21.3)","preflight|ARRIVALS":"CDU ARRIVALS page: Select runway. Select arrival routing. Note: Do not load an instrument approach before departure - this prevents unwanted automatic LNAV arming and activation if a TO/GA switch is pushed after takeoff. Execute the arrival routing and runway. (FCOM NP.21.3)","preflight|FIX INFO":"If the flight contains an ETOPS segment, on the FIX INFO page enter all ETPs from the Dispatch Release / Flight Plan and enter a 410 NM distance circle around the adequate airport used to define the EEP. (FCOM NP.21.3)","preflight|NAV RADIO":"NAV RADIO page: Tune the navigation radios as needed. (FCOM NP.21.4)","preflight|FMC COMM":"FMC COMM page: Select WIND, LOAD and execute. Select DES FORECAST, LOAD. Select CLB FORECAST, LOAD. Note: failure to enter enroute winds can result in flight plan time and fuel burn errors. (FCOM NP.21.4)","preflight|LEGS":"Verify that the route is correct on the RTE page. Check the LEGS pages as needed to ensure compliance with the flight plan. (FCOM NP.21.3)","preflight|NAV DATA":"Independent Legs Verification: for ORCN/ETOPS flights both the PF and PM independently verify the full lat/long of all unnamed oceanic waypoints. ARINC 424 check: select the waypoint on the LEGS page to the scratchpad, INIT REF, INDEX, NAV DATA, paste into IDENT, compare LATITUDE and LONGITUDE to the flight plan/clearance. (FCOM NP.21.4)","preflight|OPS CONTROL (COMPANY-FLIGHT INIT)":"COMPANY - FLIGHT INIT page: Verify or enter FLIGHT NUMBER. Enter SCHEDULED DATE (numeric day only) from the Dispatch Release. Verify/enter ORIGIN and DESTINATION STATION. Enter CAPT, FO, and R/O employee numbers. (FCOM NP.21.5)","preflight|Verify":"Verify MELs/CDLs affecting RNP, communications, or ETOPS capabilities. Check the Dispatch Release for ETOPS status. Check the ETOPS critical fuel analysis. (PRC ORCN/ETOPS Reference Card)","preflight|Alternates":"Check ETOPS alternate weather and NOTAMs. Load the flight plan in FD Pro. Ensure the PDSC/PDC have been completed and remain valid. (PRC ORCN/ETOPS Reference Card)","preflight|Program":"Program EEP, EXP and ETP/CP per aircraft-specific procedures. Perform any oceanic-specific route-verification steps (e.g., expanded lat/long check). (PRC ORCN/ETOPS Reference Card)","preflight|HF":"Locate HF frequencies and perform an HF radio check, referencing the fleet-specific manual (e.g., WWV/WWVH or VOLMET). (PRC ORCN/ETOPS Reference Card)","preflight|PM: Walk-around / Exterior Inspection":"Exterior Inspection: before each flight the PM or IRO must verify the airplane is satisfactory for flight. This is typically performed immediately after completion of the Preliminary Preflight Procedure. Items at each location may be checked in any sequence. (FCOM NP.21.6)","preflight|Individual Cockpit Preflight":"Preflight Procedure - FO and Preflight Procedure - CA: each pilot completes their own side-panel setup and flows (EFIS, MCP, oxygen test, displays, flight instruments, standby instruments). (FCOM NP.21.12 / NP.21.22)","preflight|MCP (takeoff pilot)":"MCP - Set (CA, FO). The pilot who will do the takeoff sets the MCP: Arm LNAV as needed. Arm VNAV. Set initial heading or track. Set initial altitude. (FCOM NP.21.26)","preflight|Takeoff Brief":"Taxi and Takeoff briefings - Complete (CA, FO). The pilot who will do the takeoff does the taxi and takeoff briefings. (FCOM NP.21.26)","preflight|CDU takeoff data (PF loads, PM verifies)":"CDU - Set (CA, FO). COMPANY-PERFORMANCE-TAKEOFF DATA page: Select LOAD FMC. CDU PERF INIT: Select ACCEPT, verify ZFW. CDU TAKEOFF REF 1/2: ACCEPT; verify/enter FLAPS, assumed temperature (THRUST), takeoff CG, and V1/VR/V2; set MCP IAS/MACH to V2. TAKEOFF REF 2/2: verify EO ACCEL HT, ACCEL HT, THR REDUCTION. THRUST LIM: verify OAT, select TO and CLB limits (HA operations do not allow TO 1 or TO 2). (FCOM NP.21.27)","preflight|Pax Count Verify":"Passenger Count Verification - Perform (CA, FO). The FO reads the passenger count and jumpseat numbers from the Load Closeout. The CA verifies the numbers match the Flight Deck Report provided in JetPack or via alternate means. (FCOM NP.21.27)","preflight|Gate Agent / Station Mgr":"Operational coordination with the gate agent / station manager to confirm fuel on board and review EICAS prior to door close. (Crew SOP - not a published FCOM step.)","preflight|1L door close":"The Flight Attendant confirms with the flight deck before closing the 1L (main boarding) door. (Crew SOP.) Note: when a jet bridge is connected to the 1L door, the left angle-of-attack sensor must be carefully inspected during the walkaround. (FCOM NP.21.6)","preflight|Flight Attendant":"Continue this procedure once the cabin is secure and the walkaround check is complete. Note: \"Walkaround check complete\" constitutes clearance to pressurize the hydraulic systems. Verify exterior doors closed and slides armed (doors in auto). (FCOM NP.21.28)","preflight|EICAS":"Verify the EICAS display configuration and that only expected alert and memo messages are shown; check the nosewheel lockout indication if pushback is required. (Crew SOP / FCOM NP.21)","before-start|CA":"CA coordinates with the ground crew before pushback: brakes set, confirm clear to disconnect external power/air, and stand by for push clearance. (Ground coordination - FCOM Pushback or Towing, NP.21.30)","before-start|Ramp Crew":"Pushback or Towing: Ground handling personnel - Establish communications (CA). The walkaround being complete is the trigger for the FO's before-start flow and clearance to pressurize hydraulics. (FCOM NP.21.28 / NP.21.30)","before-start|Call ATC for Push Clearance":"Obtain pushback/ramp clearance from ATC or ramp control per local procedure before commencing pushback. (Company / local procedure)","before-start|Ramp Crew (push / start)":"Pushback or Towing: TRANSPONDER MODE selector XPDR (FO). Parking brake Set or release as directed by ground handling personnel. When pushback/towing is complete: Tow bar - Verify not connected (CA); Nose gear steering - Verify not locked out (CA). (FCOM NP.21.30)","before-taxi|FO flow":"Before Taxi Procedure (start after receiving the salute): Verify all engine generator OFF lights are extinguished (FO). APU selector OFF. ENGINE ANTI-ICE selectors As needed. Verify ground personnel and equipment are clear. (FCOM NP.21.31)","before-taxi|CA":"Call \"FLAPS ___\" as needed for takeoff (CA). Flap lever Set takeoff flaps (FO). Flight controls Check (CA): make slow, deliberate inputs one direction at a time to full travel, verify freedom of movement and return to center; hold the rudder pedal disconnect switch during the rudder check. (FCOM NP.21.31)","before-taxi|PM":"Secondary Engine Indications Off (FO). Recall Check (CA, FO): verify only expected alert and memo messages are shown. (FCOM NP.21.31)","before-takeoff|PM":"Set the TAXI light switch ON and RUNWAY TURNOFF lights as needed. No less than two minutes prior to takeoff, make the \"Flight Attendants should now be seated for takeoff\" PA. Verify the CABIN READY message is shown. (FCOM NP.21.33)","before-takeoff|PF (takeoff pilot)":"The pilot who will do the takeoff updates changes to the takeoff briefing as needed. Set the weather radar display as needed. Select VSD on as needed. Set the terrain display as needed. Call \"BEFORE TAKEOFF CHECKLIST.\" (FCOM NP.21.33)","before-takeoff|Prior to hold-short - both":"Prior to crossing the hold-short line, use all available resources to verify the runway and runway entry point. Resolve any inconsistencies prior to takeoff. Both pilots announce \"Runway ___ confirmed\" when verification is complete. (FCOM NP.21.34)","before-takeoff|Crossing hold-short (PM)":"When entering the departure runway, set the WING, L/R RUNWAY TURNOFF, and STROBE light switches to ON. Use other lights as needed. Set the transponder mode selector to TA/RA. (FCOM NP.21.34)","before-takeoff|Lined up - both":"When lined up on the departure runway, both pilots visually verify the aircraft symbol on the ND map display is on the assigned runway and that the aircraft and runway headings agree. (FCOM NP.21.34)","before-takeoff|Cleared for takeoff":"When cleared for takeoff, set all LANDING light switches to ON (PM). Advance the thrust levers to approximately 40% N1. Allow the engines to stabilize. Push the TO/GA switch. Verify that the correct takeoff thrust is set. (FCOM NP.21.34)","before-takeoff|PM: “Thrust Set”":"Monitor the engine instruments during the takeoff. Adjust takeoff thrust before 80 knots as needed. During strong headwinds, if the thrust levers do not advance to the planned takeoff thrust, manually advance them before 80 knots. Call \"THRUST SET.\" (FCOM NP.21.35)","before-takeoff|@80 kt → PM: “80 Knots” / PF: “Check”":"Verify 80 knots and call \"CHECK\" (PF). Call \"80 KNOTS\" (PM). After takeoff thrust is set, the CA's hand must be on the thrust levers until V1. Verify V1 speed; verify the automatic V1 callout or call \"V1.\" (FCOM NP.21.35)","before-takeoff|PM: “Positive Rate” → PF: “Gear Up”":"At VR, rotate toward 15 degrees pitch attitude; at VR call \"ROTATE.\" Verify a positive rate of climb on the altimeter and call \"POSITIVE RATE\" (PM). Verify a positive rate and call \"GEAR UP\" (PF). Set the landing gear lever to UP (PM). (FCOM NP.21.35)","before-takeoff|@200 ft → PF: “Autopilot On” (as needed)":"At 200 ft, PF \"Autopilot On\" (as needed). Above 400 feet radio altitude, PF calls for a roll mode as needed; PM selects/verifies the roll mode and verifies VNAV engaged. Verify that climb thrust is set. (FCOM NP.21.35 / PRC Takeoff profile)","after-takeoff|PF":"Verify acceleration at the acceleration height. Call \"FLAPS ___\" according to the flap retraction schedule. Engage the autopilot when above the minimum altitude for autopilot engagement. Verify CLB thrust is set and verify altitude capture. (FCOM NP.21.35)","after-takeoff|PM":"After flap retraction is complete, set the ENGINE ANTI-ICE selectors to AUTO and the NOSE LANDING and TAXI light switches to OFF. Do the AFTER TAKEOFF checklist. (FCOM NP.21.35)","cruise|PM":"During climb or cruise, verify the RNP as needed. (FCOM NP.21.37)","cruise|At 10,000 ft MSL (PM)":"At 10,000 feet MSL, set the LEFT and RIGHT LANDING, RUNWAY TURNOFF, and WING light switches to OFF, and push the CABIN CHIME button twice. Note: a pause of at least three seconds must be observed between CABIN CHIME pushes. Clear any manually tuned NAVAIDs that are no longer needed. (FCOM NP.21.37)","cruise|Above FL180 (PM)":"Set the seatbelt signs as needed above FL180. Note: when the seat belt sign is turned off for the first time after takeoff, crews must make a Seat Belt Advisory PA (FOM 3.100). On the COMPANY - DEPARTURE REPORT page, verify or set the OUT TIME, OFF TIME, and TAKEOFF PILOT. (FCOM NP.21.37)","cruise|Above transition altitude":"When climbing above the transition altitude, set the altimeters to standard. (FCOM NP.21.37)","cruise|Fuel (PM)":"If the FUEL IN CENTER message shows, set both CENTER FUEL PUMP switches to ON. When the FUEL LOW CENTER message shows, set both CENTER FUEL PUMP switches to OFF. (FCOM NP.21.38)","cruise|Before T/D":"Before the top of descent, modify the active route as needed for the arrival and approach, and on the VNAV DES page set the descent speed to CI mach/300, unless a different speed is requested by ATC. (FCOM NP.21.38)","cruise|Coordinate route changes":"Coordinate changes to the planned route (except weather deviations) with Dispatch to ensure the aircraft remains within the Maximum Diversion Distance. (PRC ORCN/ETOPS Reference Card)","cruise|Report":"Report speed changes of Mach 0.02 or greater. Report ETA changes of 3 minutes or greater (non-CPDLC). (PRC ORCN/ETOPS Reference Card)","cruise|Waypoint passage":"Approaching each waypoint: confirm the next waypoint matches the cleared route; fuel check; ATC position report (non-CPDLC); approximately two minutes after the FMC sequences, crosscheck navigation (LNAV showing the correct TO waypoint and cross-track deviation). (PRC ORCN/ETOPS Reference Card)","cruise|Fuel awareness":"Arriving at the CP/ETP with FOB equal to or greater than the critical-fuel-scenario fuel is a dispatch requirement. ETPs are calculated using winds at 10,000 ft. Be continuously aware of the airport that would take the least time to fly to at or near cruise altitude. (FOM 6.3.6 / 6.3.7)","descent|Start":"Start the Descent Procedure before the airplane descends below the cruise altitude for arrival at destination. Complete the Descent Procedure by 10,000 feet AFE. (FCOM NP.21.39)","descent|Review (both)":"Review all alert and memo messages. Review all operational notes. Recall and review all alert and memo messages and operational notes. (FCOM NP.21.39)","descent|Check landing performance":"Check landing performance. Verify VREF on the APPROACH REF page (the PM enters VREF). (FCOM NP.21.39)","descent|Set minimums":"Set the RADIO/BARO minimums for the approach. MDA: set BARO to MDA + 50 (set BARO to MDA if a note allows authorized operators to use DA in lieu of MDA). DA: set BARO to the published DA. CAT II: set RADIO to DH. CAT III: reset (blank) minimums. (FCOM NP.21.39)","descent|PM":"Set the NAV RADIO page for the approach. Set the AUTOBRAKE selector to the needed setting. For CAT II/III, AUTOBRAKE must be set to a value that results in a factored landing distance not exceeding the landing distance available. (FCOM NP.21.39)","descent|FMC crosscheck (both)":"If LNAV or VNAV is used for the arrival/approach, both pilots crosscheck the FMC waypoint names, speeds, altitudes and sequences against the appropriate chart. (FCOM NP.21.39)","descent|Approach briefing":"Do the approach briefing. Note: the approach briefing must include a reminder that go-arounds on or near the ground require go-around thrust to be set manually and that a flap configuration warning can sound. Call \"DESCENT CHECKLIST.\" (FCOM NP.21.39)","approach|Start":"The Approach Procedure is normally started at transition level. Complete it before the IAF, the start of radar vectors to the final approach course, or the start of a visual approach. Do not manually build the approach or add waypoints to the selected FMC procedure. (FCOM NP.21.40)","approach|PM":"During arrival and approach, verify the RNP as needed. Set the seatbelt signs ON prior to descending below FL180. No later than FL180, make the \"Flight Attendants, please prepare the cabin for arrival and be seated for landing\" PA. (FCOM NP.21.40)","approach|At 10,000 ft AFE (PM)":"At 10,000 feet AFE, set the LEFT and RIGHT LANDING, RUNWAY TURNOFF, and WING light switches to ON, and push the CABIN CHIME button twice. Note: a pause of at least three seconds between CABIN CHIME pushes. (FCOM NP.21.40)","approach|Below transition level":"When descending below the transition level, set the altimeters. (FCOM NP.21.40)","approach|PF":"Update the arrival and approach as needed. Select VSD on as needed. Update the approach briefing as needed. Call \"APPROACH CHECKLIST.\" (FCOM NP.21.40)","landing|PF (final)":"Call \"FLAPS ___\" according to the flap extension schedule. When on localizer intercept heading, verify the navigation radios are tuned and identified and the deviation pointers are shown. Arm the APP mode. Use LNAV, HDG SEL/TRK SEL or HDG HOLD/TRK HOLD to intercept the final approach course as needed. (FCOM NP.21.42)","landing|PM: “LOCALIZER ALIVE”":"Call \"LOCALIZER ALIVE.\" Verify that the localizer is captured and verify the final approach course heading. Call \"GLIDESLOPE ALIVE.\" (FCOM NP.21.42)","landing|At G/S alive - PF":"At glideslope alive, call \"GEAR DOWN\" and \"FLAPS 20.\" The PM sets the landing gear lever to DN and the flap lever to 20. Set the speedbrake lever to ARMED. (FCOM NP.21.42)","landing|At G/S capture - PF":"At glideslope capture, call \"FLAPS ___\" as needed for landing. Set the missed approach altitude on the MCP. Call \"LANDING CHECKLIST.\" (FCOM NP.21.42)","landing|Autobrake MANDATORY":"Use of the autobrake system is MANDATORY for CAT II/III operations (FCTM 6.21). All CAT I callouts apply. Radio Altitude Minimums selector = DH for CAT II; reset (blank) minimums for CAT III. (PRC CAT II/III Standard Callouts)","landing|@500 ft AFE - PM":"At 500 ft AFE: PM calls \"Stable, [Autoland Status]\" or \"No Autoland, Go-Around\"; PF replies \"Checked\" or \"Go-Around.\" (PRC CAT II/III Standard Callouts)","landing|@RA+100 - PM":"At RA + 100 ft: PM calls \"100 Above\"; PF replies \"Checked.\" (* if the auto callout is inoperative.) (PRC CAT II/III Standard Callouts)","landing|@DH - PM":"At DH: PM calls \"Minimums\"; PF replies \"Continue,\" \"Go Around,\" or \"Landing.\" (PRC CAT II/III Standard Callouts)","landing|PF (rollout)":"Apply reverse thrust as needed. Before taxi speed, disarm the autobrake and use manual braking as needed. Before turning off the runway, disconnect the autopilot. (FCOM NP.21.52)","after-landing|Speedbrake":"The CA positions or verifies that the SPEEDBRAKE lever is DOWN. (FCOM NP.21.53)","after-landing|PM After-Landing flow":"Set the APU selector to START, then ON, as needed. Set the ENGINE ANTI-ICE selectors to ON, if needed. Set the weather radar to off. Set the AUTOBRAKE selector OFF. Set the flap lever to UP. Set the transponder mode selector to XPDR. On the COMPANY - ARRIVAL REPORT page, verify or set the ON TIME, IN TIME, and LANDING PILOT. (FCOM NP.21.53)","shutdown|Shutdown flow":"Parking brake Set (PF). Electrical power Set (FO). FUEL CONTROL switches CUTOFF (CA). SEAT BELTS selector OFF. HYDRAULIC panel pumps OFF. FUEL PUMP switches OFF. BEACON OFF. FLIGHT DIRECTOR switches OFF. TRANSPONDER MODE selector STANDBY. Status messages Check. APU selector As needed. Call \"SHUTDOWN CHECKLIST.\" (FCOM NP.21.54)","secure|Run any time flight deck left unattended":"Run the Secure Procedure any time the flight deck will be left unattended. (FCOM NP.21.56)","secure|FO":"IRS selectors OFF. BATTERY switch Off. Emergency lights Off. Packs Off. (FCOM NP.21.56 / QRH SECURE)","go-around|PM":"Verify that the thrust is sufficient for the go-around or adjust as needed and call \"THRUST SET.\" Set the flap lever as directed by the PF. (FCOM NP.21.51)","go-around|PM: “Positive Rate” → PF: “Gear Up”":"Verify a positive rate of climb on the altimeter and call \"POSITIVE RATE\" (PM). Call \"GEAR-UP\" (PF). Set the landing gear lever to UP (PM). (FCOM NP.21.51)","go-around|@200 ft → PF: “Autopilot On” (as needed)":"At 200 ft, PF \"Autopilot On\" (as needed). Above 400 feet radio altitude, PF selects or verifies a roll mode. (FCOM NP.21.51 / PRC Go-Around profile)","go-around|Accel ht":"At acceleration height, set the speed to the maneuver speed for the planned flap setting and call \"FLAPS ___\" according to the flap retraction schedule. After flaps are set and at or above flap maneuvering speed, select FLCH or VNAV as needed. Verify that climb thrust is set. Call \"AFTER TAKEOFF CHECKLIST.\" (FCOM NP.21.51)","diversion|1 - Complete the NNC":"Complete the applicable Non-Normal Checklist (the EICAS checklist) before deciding on a diversion. (PRC Mechanical Abnormality Diversion Guidance)","diversion|2 - Does the failure require diversion?":"Does the failure require diversion? If YES, DIVERT (coordinate with SOCC). (PRC Mechanical Abnormality Diversion Guidance)","diversion|3 - If not required":"If diversion is not required, ask: are the risks of continuing higher than the risks of diverting? If yes, DIVERT (coordinate with SOCC); otherwise continue to destination. (PRC Mechanical Abnormality Diversion Guidance)","diversion|Failures requiring diversion":"Failures requiring diversion: insufficient fuel remaining due to higher fuel consumption following a component failure; any failure where the crew must land at the nearest suitable airport (QRH NNC \"Land at Nearest Suitable Airport\"); fire or smoke that continues; only two power sources remain (two main engine generators, or one main engine generator and both APU generators); any other situation the crew determines has a significant adverse effect on safety if the flight is continued. (PRC Mechanical Abnormality Diversion Guidance)","diversion|Engine failure (one inop)":"14 CFR 121.565 requires the CA of a two-engine airplane with one engine inoperative to land at the nearest suitable airport where, in the CA's judgment after considering all relevant factors, a safe landing can be made. (FOM 6.4.2)","diversion|CA":"The CA should assign PF/PM for landing based on Threat and Error Management (TEM) principles. If contingency procedures are employed as a result of an engine shutdown or system failure, the CA should advise ATC as soon as practicable, remind ATC of the aircraft type, and request expeditious handling. (FOM 6.4.2 / 6.4.6)","diversion|Maintain awareness":"Flight crews will: maintain awareness of suitable airports; have a current diversion plan in mind; keep track of weather and NOTAMs at the diversion airport; be prepared to coordinate with Dispatch in the event of an actual diversion; and include the current diversion plan in the brief after a rest period. (FOM 6.4.1)","diversion|180° turn near ETP":"If a 180-degree turn is necessary near a fuel-critical ETP, be aware that the time to complete the turn is not factored into the fuel or time calculations by the flight planning system. (FOM 6.4.1)","etops|Diversion speed":"Engine-inoperative ETOPS fuel requirements are based on the approved One-Engine-Inoperative Cruise Speed, which should be followed in case of a diversion following an actual engine failure. The CA has the authority to deviate from this planned speed profile after assessing the emergency and considering fuel remaining. (FOM 6.4.5)","etops|Pick the field":"Most diversions do not require a descent well below cruise altitude, so be continuously aware of the airport that would take the least time to fly to at or near cruise altitude. A closer suitable airport that is not a designated ETOPS alternate may be the better choice. (FOM 6.3.7)","etops|Fuel":"Arriving at the CP/ETP with FOB at or above the critical-fuel-scenario fuel is a dispatch requirement; if it appears FOB at the CP/ETP will be lower, there is no requirement to divert prior to the CP provided estimated fuel at destination is above arrival requirements, and the Dispatcher should evaluate changes to altitude, speed, enroute alternate, and routing. (FOM 6.3.6)","etops|Coordinate":"If the decision is made to divert, advise ATC as soon as practicable and request expeditious handling; coordinate with Dispatch (see Nearest Suitable Airport). (FOM 6.4.4 / 6.4.6)","etops|1 - Offset":"Turn to offset from the route using the Special Procedures for In-Flight Contingencies. (FOM 6.4.3)","etops|2 - Emergency Descent":"Perform an Emergency Descent to 10,000 ft or MOCA/Grid MORA, whichever is higher. (FOM 6.4.3)","etops|3 - Below FL290":"Below FL290, or sooner if cleared by ATC, proceed directly to the nearest suitable airport. (FOM 6.4.3)","etops|4 - When level":"When level, use the Flight Plan one-engine diversion speed, or (AS) Long Range Cruise (LRC) for a two-engine decompression. (FOM 6.4.3)","oceanic|Get a revised clearance first":"If an aircraft is unable to continue the flight in accordance with its ATC clearance, a revised clearance shall be obtained, whenever possible, prior to initiating any action. (FOM 5.7.4.2)","oceanic|Choose turn direction":"The direction of the turn should be based on one or more of: aircraft position relative to any organized track or ATS route system; direction of flights and flight levels allocated on adjacent tracks; direction to an alternate airport; any strategic lateral offset being flown; and terrain clearance. (FOM 5.7.4.2)","oceanic|2 - Altitude":"The aircraft should be below FL290 prior to diverting from the assigned clearance unless a revised ATC clearance has been obtained. Once established on a same-direction parallel route 5 nm offset, establish a 500-ft vertical offset and proceed as required by the situation. (FOM 5.7.4.2 / 5.7.4.3)","oceanic|3 - Squawk / lights / TCAS":"TCAS should operate in TA/RA mode whenever possible. Turn on all aircraft exterior lights. Keep the transponder on at all times and, when able, squawk 7700 as appropriate. (FOM 5.7.4.2)","oceanic|4 - Broadcast":"Establish communications with and alert nearby aircraft by broadcasting on the frequencies in use and on 121.5 MHz (backup 123.45 MHz): aircraft identification, the nature of the distress condition, intentions, position (including the ATS route designator or track code), and flight level. Use MAYDAY or PAN-PAN, preferably spoken three times. (FOM 5.7.4.2)","oceanic|Request first":"When weather deviation is required, request an ATC clearance: state \"WEATHER DEVIATION REQUIRED\" to indicate priority is desired, or request a deviation using a CPDLC lateral downlink message. If necessary use the urgency call \"PAN-PAN,\" preferably spoken three times. (FOM 5.7.4.4)","oceanic|If no clearance":"If unable to obtain ATC clearance: if possible, deviate away from the track system; broadcast on VHF 121.5 and 123.45 (call sign, flight level, position, and intentions); monitor TCAS; turn all exterior lights ON; deviate from course as required to avoid weather; and continue trying to obtain an ATC clearance. (PRC Oceanic References / FOM 5.7.4.6)","oceanic|< 5 NM":"For deviations less than 5 nm, maintain the assigned flight level. (FOM 5.7.4.6)","oceanic|≥ 5 NM":"For deviations of 5 nm or more without a clearance, when approximately 5 nm from track initiate a level change: PRC Pacific - climb +300 ft if south of track, descend -300 ft if north of track. FOM magnetic-track table: EAST (000-179 deg) L = descend 300, R = climb 300; WEST (180-359 deg) L = climb 300, R = descend 300. (FOM 5.7.4.6 / PRC)","oceanic|SLOP":"Use the Strategic Lateral Offset Procedure (SLOP) as standard practice in oceanic operations: fly 0.0-2.0 nm right of course only, in 0.1 nm increments; left of course is not authorized. No ATC clearance is required and ATC need not be advised; return to centerline by the oceanic exit point. (FOM 5.7.4.7)","oceanic|KZAK Oakland":"KZAK Oakland Oceanic FIR: log on 45-15 minutes prior to entry but not below 10,000 ft MSL if not auto-transferred. Squawk 2000. Max uplink delay 300. SELCAL check required with San Francisco Radio. SLOP 0-2 nm right. (PRC FIR/OCA Reference Cards)","oceanic|Holding speeds":"Oceanic holding speeds (KIAS): 0-6,000 ft = 200; 6,001-14,000 ft = 230; 14,001 ft and above = 265. (PRC FIR/OCA Reference Cards)","depress|1 - Descend to 18,000 ft MSL":"Initially descend to 18,000 ft MSL and track to the nearest suitable airport (use the PRC recommended-airport list). (PRC Western US Depress Strategy)","depress|2 - Do NOT descend below highest MORA":"Do not descend below the highest MORA between the present position and the selected diversion airport. (PRC Western US Depress Strategy)","depress|3 - Step down":"Progressively step down to the next-highest MORA and 10,000 ft MSL as soon as possible. (PRC Western US Depress Strategy)","depress|O2 / time":"Depressurization oxygen requirements: by 5 minutes from depressurization, descend to FL180 or below; by 45 minutes, descend to FL100 or below. (PRC Western US Depress Strategy)"};

let state={phase:'preflight',seat:'C',duty:'PF',appr:'ILS',cat:1,hideOther:false,notesOpen:false};
// QRH normal checklists (item, response, role) for click-to-show with role greying
const CHECKLISTS={
 'Preflight':[['Oxygen','Tested, 100%','B'],['Flight instruments','Heading / Altimeter','B'],['Parking brake','Set','C'],['FUEL CONTROL switches','CUTOFF','C'],['Logbook','Onboard','C']],
 'Before Start':[['Flight deck door','Closed and locked','F'],['Passenger signs','___','F'],['MCP','V2, HDG/TRK, ALTITUDE','PF'],['Takeoff speeds','V1, VR, V2','B'],['CDU preflight','Completed','B'],['Trim','___ Units, 0','C'],['Taxi and takeoff briefing','Completed','PF'],['BEACON','ON','F']],
 'Before Taxi':[['Anti-ice','___','F'],['Recall','Checked','B'],['Autobrake','RTO','F'],['Flight controls','Checked','C'],['Ground personnel and equipment','Clear','B']],
 'Before Takeoff':[['Flaps','___','PF'],['Cabin Crew','Advised','PM']],
 'After Takeoff':[['Landing gear','UP','PM'],['Flaps','UP','PM']],
 'Descent':[['Recall','Checked','B'],['Notes','Checked','B'],['Autobrake','___','PM'],['Landing data','VREF, Minimums','B'],['Approach briefing','Completed','PF']],
 'Approach':[['Altimeters','___','B']],
 'Landing':[['Speedbrake','ARMED','PF'],['Landing gear','DOWN','PF'],['Flaps','___','PF']],
 'Shutdown':[['Hydraulic panel','Set','F'],['Fuel pumps','Off','F'],['Flaps','UP','C'],['Parking brake','___','C'],['FUEL CONTROL switches','CUTOFF','C'],['Weather radar','Off','B']],
 'Secure':[['IRS','Off','F'],['Battery','Off','F'],['Emergency lights','Off','F'],['Packs','Off','F']]
};
function roleMatch(r){
  if(!r||r==='B')return true;
  if(r==='C')return state.seat==='C';
  if(r==='F')return state.seat==='F';
  if(r==='PF')return state.duty==='PF';
  if(r==='PM')return state.duty==='PM';
  return true;
}
function apprVisible(a){
  if(!a||a==='all')return true;
  if(a==='ILScat')return state.appr==='ILS'&&state.cat>=2;
  return state.appr===a;
}
const RTAG={C:'CA',F:'FO',PF:'PF',PM:'PM'};
function rtagHtml(r){ return RTAG[r]?`<span class="rtag ${r}">${RTAG[r]}</span>`:''; }
const LIM=/(40°C|FL\d{3}|VREF\d*|RNP ?[0-9.]+|V1|VR|V2|MORA|MOCA|10,000 ft|18,000|FL180|FL100|300 ft|500 ft|400 ft|200 ft|75 ft|80 KIAS|60 KIAS|7700|121\.5|123\.45|5 nm|2 nm|1 × RNP|0\.10|30°)/g;
function hl(s){ return s? s.replace(LIM,'<span class="lim">$1</span>') : ''; }
function boldCO(s){ return s.replace(/[“"]([^”"]*)[”"]/g,'<b class="co">“$1”</b>'); }
const STATES=/\b(ON|OFF|AUTO|SET|UP|DN|DOWN|CUTOFF|RUN|ARM|ARMED|RTO|STBY|STANDBY|XPDR|TA\/RA|NORM|CLOSED|OPEN)\b/g;
function boldST(s){ return s.replace(STATES,'<b>$1</b>'); }
function deco(s){ return s? hl(boldST(boldCO(s))) : ''; }
function bullets(s){ if(!s)return ''; const p=s.split(' · '); if(p.length<2 && !s.includes(' » '))return `<div class="s">${deco(s)}</div>`;
  return `<ul class="bl">${p.map(x=>{ if(x.includes(' » ')){ const pt=x.split(' » '); const kids=pt[1].split(' ; ').map(k=>`<li>${deco(k.trim())}</li>`).join(''); return `<li>${deco(pt[0].trim()).replace(/\((\d+)\)/,'<b>($1)</b>')}<ul class="sub">${kids}</ul></li>`; } return `<li>${deco(x)}</li>`; }).join('')}</ul>`; }
const EXP='<span class="exp">&#9656;</span>';

function renderItem(it,cite,ctx,pid){
  if(it.k==='sub') return `<div class="sub" style="background:${it.c}">${it.t}</div>`;
  if(it.k==='note') return `<div class="note">${deco(it.t)}</div>`;
  if(it.k==='book') return `<div class="book"><div class="t">${it.t}</div>${bullets(it.s)}</div>`;
  if(it.k==='trig'){ if(!roleMatch(it.r)&&state.hideOther)return ''; const dim=!roleMatch(it.r)?' dim':'';
    return `<div class="trig${dim}"><span class="ic">&#9654;</span><span>${deco(it.t)}</span></div>`; }
  if(it.k==='cl'){ const items=CHECKLISTS[it.t]||[];
    const w=it.w?`<span class="w">when: ${deco(it.w)}</span>`:'';
    const body=items.filter(ci=>!(state.hideOther&&!roleMatch(ci[2]))).map(ci=>`<div class="cli${roleMatch(ci[2])?'':' dim'}"><span class="cii">${ci[0]}</span><span class="civ">${deco(ci[1])}</span>${rtagHtml(ci[2])}</div>`).join('')||'<div class="cli">(reference)</div>';
    return `<div class="clwrap"><div class="cl${it.bold?' bold':''} has-cl"><span class="ic">&#10003;</span><span class="cln">${it.t} Checklist${w}</span>${EXP}</div><div class="clbody">${body}</div></div>`; }
  if(it.k==='box'){ const match=roleMatch(it.r); if(!match&&state.hideOther)return ''; const dim=match?'':' dim'; const n=ctx.n++;
    const q=it.q || (typeof QUOTES!=='undefined' ? (QUOTES[pid+'|'+it.t]||'') : '');
    const cls='it'+(it.call?' say':'')+(it.fmc?' fmc':'')+(q?' has-q':'')+dim;
    const sayb=it.call?'<span class="sayb">&#10078;</span>':'';
    const stag=((cite||'').trim().split(/[\s·\/]+/).filter(Boolean)[0]||'ref').replace(/[^A-Za-z0-9.]/g,'');
    const badge=q?`<span class="exp">${stag} &#9656;</span>`:'';
    const t=`<div class="t">${sayb}${deco(it.t)}${rtagHtml(it.r)}${badge}</div>`;
    const qb=q?`<div class="qbox"><span class="qsrc">${cite}</span><span class="qt">${q}</span></div>`:'';
    return `<div class="${cls}"><div class="stepn">${n}</div><div class="body">${t}${bullets(it.s)}${qb}</div></div>`; }
  return '';
}
function gateFor(ph){
  const names=[];
  ph.sections.forEach(s=>{ if(apprVisible(s.appr)) s.items.forEach(it=>{ if(it.k==='cl') names.push(it.t+' Checklist'); }); });
  return [...new Set(names)];
}
let CARDS=[];
function render(){
  if(state.notesOpen){ renderNotes(); return; }
  const ph=PHASES.find(p=>p.id===state.phase);
  const main=document.getElementById('main');
  const ctx={n:1};
  CARDS=[];
  ph.sections.forEach(sec=>{
    if(!apprVisible(sec.appr))return;
    const cite=sec.cite||ph.src;
    const inner=sec.items.map(it=>renderItem(it,cite,ctx,ph.id)).join('');
    CARDS.push(`<div class="card"><div class="ch" style="--ec:${sec.c}"><span class="hn">${sec.h}</span><span class="cardcite">${cite}</span></div><div class="cb">${inner}</div></div>`);
  });
  main.innerHTML=`<div class="phasehead">${ph.title}<span class="src">${ph.src}</span></div><div class="grid" id="grid"></div>`;
  const g=document.getElementById('gate'); const gn=gateFor(ph);
  if(gn.length){ g.className='gate'; g.innerHTML=`<span class="lbl">GATE</span><span class="nm">&#10003; ${gn.join('  ·  ')}</span>`; }
  else g.className='gate none';
  const showAppr=ph.id==='landing';
  document.getElementById('apprwrap').style.display=showAppr?'flex':'none';
  document.getElementById('cat').style.display=(showAppr&&state.appr==='ILS')?'flex':'none';
  document.querySelectorAll('#nav button, #rail button').forEach(b=>b.classList.toggle('on',b.dataset.p===state.phase));
  saveState();
  fitToScreen();
}
function saveState(){ try{localStorage.setItem('b787state',JSON.stringify({phase:state.phase,seat:state.seat,duty:state.duty,appr:state.appr,cat:state.cat,hideOther:state.hideOther}));}catch(e){} }
// Flowing N-column layout (CSS multicol): content flows column to column to fill white space,
// breaking only BETWEEN steps (never mid-step). One consistent font for EVERY phase, sized so the
// busiest page fits; sparse pages use the same font. Recomputed when geometry or the hide-other toggle changes.
const FLOOR=11, MAXF=18;
let GFONT=0, lastW=0, lastH=0, lastHide=null;
function cardsFor(pid){
  const ph=PHASES.find(p=>p.id===pid); if(!ph)return [];
  const ctx={n:1}; const out=[];
  ph.sections.forEach(sec=>{ if(!apprVisible(sec.appr))return; const cite=sec.cite||ph.src;
    const inner=sec.items.map(it=>renderItem(it,cite,ctx,ph.id)).join('');
    out.push(`<div class="card"><div class="ch" style="--ec:${sec.c}"><span class="hn">${sec.h}</span><span class="cardcite">${cite}</span></div><div class="cb">${inner}</div></div>`);
  });
  return out;
}
function applyCols(grid,cardsHTML,ncol,fontPx){
  grid.style.display='block'; grid.style.columnCount=ncol; grid.style.columnGap='11px'; grid.style.fontSize=fontPx+'px';
  grid.innerHTML=cardsHTML.join('');
  return grid.scrollHeight;
}
function notesCards(){
  const c=(h,ec,body)=>`<div class="card"><div class="ch" style="--ec:${ec}"><span class="hn">${h}</span></div><div class="cb">${body}</div></div>`;
  const bl=(arr)=>`<ul class="bl">${arr.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  const tg=(t)=>`<div class="trig"><span class="ic">&#10148;</span><span>${t}</span></div>`;
  return [
    c('CHECKLISTS &mdash; IN ORDER','#01426A','<ol class="cl-order">'+
      ['Pre-Flight','Before Start','Before Taxi','Before T/O','After T/O','Descent','Approach','Landing','Shutdown','Securing']
      .map(x=>`<li>${x}</li>`).join('')+'</ol>'),
    c('PREFLIGHT CHECKLIST 3 (HUD)','#5A4AB7', bl(['Clearance','Route','Brief'])),
    c('&lt; START CHECKLIST 4 (WALK AROUND)','#00805E', bl(['Perf','T/O Data','Final TPR','Load Closeout'])),
    c('&lt; TAXI CHECKLIST 5 (PIN/SALUTE)','#0a8fb0', bl(['Flaps','WXR','EICAS','Controls','Recall'])),
    c('V1 CUT','#c0392b', bl(['Bug Up','Clean Up','Con','Confirm E/O','Checklist/Checklist'])),
    c('APPROACH SETUP','#E0A100', bl(['ATIS','Build','Bug','Brakes','Brief','RNP/Recall'])),
    c('EMERGENCY COMMS','#7b2fb0', bl(['FO','ATC','FA (NTSB)','PAX (Mech Malf, Listen to FA)','Company'])),
    tg('Final Flaps &#8594; Bug Ref Speed'),
    tg('G/S Cap &#8594; Declutter HUD'),
    tg('Go Around &#8594; Low Level Brief'),
    c('OODA LOOP','#334e68', bl(['Observe','Orient','Decide','Act'])),
    c('CLEAR RUNWAY','#2e7d5b', `<ul class="bl"><li>Speed Brake - DOWN</li><li>PM Flow`+
      bl(['APU - ON','Anti Ice','WXR - OFF','Brakes - OFF','Flaps - UP','XPDR','Arrival Report'])+
      `</li></ul>`),
  ];
}
function fitNotesToScreen(){
  const grid=document.getElementById('grid'); if(!grid)return;
  const main=document.getElementById('main'); const phh=document.querySelector('.phasehead'); if(!phh)return;
  const avail=main.clientHeight - phh.offsetHeight - 12; if(avail<=4)return;
  const W=grid.clientWidth||main.clientWidth;
  const ncol=colsForWidth(W);
  const f=bestFontFor(CARDS,ncol,avail,grid);
  applyCols(grid,CARDS,ncol,f);
  requestAnimationFrame(positionCues);
}
function renderNotes(){
  const main=document.getElementById('main');
  main.innerHTML=`<div class="phasehead">NOTES<span class="src">tap anywhere to close</span></div><div class="grid notesmode" id="grid"></div>`;
  CARDS=notesCards();
  document.getElementById('gate').className='gate none';
  document.getElementById('apprwrap').style.display='none';
  document.querySelectorAll('#nav button, #rail button').forEach(b=>b.classList.remove('on'));
  document.getElementById('notesBtn').classList.add('on');
  fitNotesToScreen();
}
function openNotes(){
  state.notesOpen=true;
  document.getElementById('prev').style.display='none';
  document.getElementById('next').style.display='none';
  render();
}
function closeNotes(){
  state.notesOpen=false;
  document.getElementById('notesBtn').classList.remove('on');
  document.getElementById('prev').style.display='';
  document.getElementById('next').style.display='';
  render(); scrollActive();
}
function fitCurrent(){ if(state.notesOpen) fitNotesToScreen(); else fitToScreen(); }

function bestFontFor(cardsHTML,ncol,avail,grid){ for(let f=MAXF;f>FLOOR;f--){ if(applyCols(grid,cardsHTML,ncol,f)<=avail) return f; } return FLOOR; }
function computeGFont(ncol,avail,grid){
  const cand=['preflight','before-takeoff','after-takeoff','cruise','descent','approach','landing','memory','limitations','oceanic','etops','diversion'];
  let g=MAXF;
  for(const pid of cand){ const c=cardsFor(pid); if(!c.length)continue; const f=bestFontFor(c,ncol,avail,grid); if(f<g)g=f; }
  return g;
}
function colsForWidth(W){ return W>=760?4 : W>=520?3 : W>=340?2 : 1; }
function fitToScreen(){
  const grid=document.getElementById('grid'); if(!grid||!CARDS.length)return;
  const main=document.getElementById('main'); const phh=document.querySelector('.phasehead'); if(!phh)return;
  const avail=main.clientHeight - phh.offsetHeight - 12; if(avail<=4)return;
  const W=grid.clientWidth||main.clientWidth;
  const ncol=colsForWidth(W);
  if(!GFONT || Math.abs(W-lastW)>6 || Math.abs(avail-lastH)>6 || lastHide!==state.hideOther){ GFONT=computeGFont(ncol,avail,grid); lastW=W; lastH=avail; lastHide=state.hideOther; }
  applyCols(grid,CARDS,ncol,GFONT);
  requestAnimationFrame(positionCues);
}
function positionCues(){
  const m=document.getElementById('main'); const cl=document.getElementById('cueL'), cr=document.getElementById('cueR');
  if(!m||!cl||!cr)return;
  const r=m.getBoundingClientRect(); const max=m.scrollWidth-m.clientWidth; const over=max>6;
  [cl,cr].forEach(c=>{ c.style.top=r.top+'px'; c.style.height=r.height+'px'; });
  cr.classList.toggle('show', over && m.scrollLeft < max-4);
  cl.classList.toggle('show', over && m.scrollLeft > 4);
}
let _rt; function reflow(){clearTimeout(_rt);_rt=setTimeout(()=>{setHtop();fitCurrent();},120);}
window.addEventListener('resize',reflow);
window.addEventListener('orientationchange',()=>setTimeout(()=>{setHtop();fitCurrent();},350));
if(window.visualViewport)window.visualViewport.addEventListener('resize',reflow);

const NORMAL=PHASES.filter(p=>p.kind==='n'), ABN=PHASES.filter(p=>p.kind==='a');
(function(){
  let html='<span class="navlabel">NORMAL</span>';
  NORMAL.forEach(p=>{ html+=`<button data-p="${p.id}">${p.label}</button>`; });
  html+='<div class="divider"></div><span class="navlabel">NON-NORMAL</span>';
  ABN.forEach(p=>{ html+=`<button class="ab" data-p="${p.id}">${p.label}</button>`; });
  document.getElementById('nav').innerHTML=html;
  document.getElementById('rail').innerHTML=html;
  document.querySelectorAll('#nav button[data-p], #rail button[data-p]').forEach(b=>b.addEventListener('click',()=>{
    state.phase=b.dataset.p; render(); scrollActive(); }));
})();
const navEl=document.getElementById('nav');
navEl.insertAdjacentHTML('afterbegin','<button class="npag l gone" id="npl" aria-label="Scroll phases left">&#8249;</button>');
navEl.insertAdjacentHTML('beforeend','<button class="npag r" id="npr" aria-label="Scroll phases right">&#8250;</button>');
function navPage(dir){ navEl.scrollBy({left:dir*Math.max(170,navEl.clientWidth*0.72),behavior:'smooth'}); }
document.getElementById('npl').addEventListener('click',()=>navPage(-1));
document.getElementById('npr').addEventListener('click',()=>navPage(1));
function updPagers(){ const max=navEl.scrollWidth-navEl.clientWidth;
  document.getElementById('npl').classList.toggle('gone',navEl.scrollLeft<=4);
  document.getElementById('npr').classList.toggle('gone',navEl.scrollLeft>=max-4); }
navEl.addEventListener('scroll',updPagers,{passive:true});
window.addEventListener('resize',updPagers);
function scrollActive(){
  const n=document.querySelector('#nav button.on'); if(n&&n.scrollIntoView)n.scrollIntoView({inline:"center",block:"nearest"});
  const r=document.querySelector('#rail button.on'); if(r&&r.scrollIntoView)r.scrollIntoView({block:"nearest"});
}
function step(dir){
  const i=PHASES.findIndex(p=>p.id===state.phase);
  const j=Math.min(PHASES.length-1,Math.max(0,i+dir));
  state.phase=PHASES[j].id; render(); scrollActive();
}
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
document.querySelectorAll('#seat button').forEach(b=>b.addEventListener('click',()=>{
  state.seat=b.dataset.s; document.querySelectorAll('#seat button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
document.querySelectorAll('#duty button').forEach(b=>b.addEventListener('click',()=>{
  state.duty=b.dataset.d; document.querySelectorAll('#duty button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
document.querySelectorAll('#appr button').forEach(b=>b.addEventListener('click',()=>{
  state.appr=b.dataset.a; document.querySelectorAll('#appr button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
document.querySelectorAll('#cat button').forEach(b=>b.addEventListener('click',()=>{
  state.cat=+b.dataset.c; document.querySelectorAll('#cat button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
const filtBtn=document.getElementById('filt');
function setFilt(){ filtBtn.textContent=state.hideOther?'MINE':'BOTH'; filtBtn.classList.toggle('on',state.hideOther);
  filtBtn.title=state.hideOther?'Showing only my steps - tap to show both crew members':'Showing both crew members - tap to show only my steps'; }
filtBtn.addEventListener('click',()=>{ state.hideOther=!state.hideOther; setFilt(); GFONT=0; render(); });
document.getElementById('notesBtn').addEventListener('click',()=>{ if(state.notesOpen)closeNotes(); else openNotes(); });
document.getElementById('main').addEventListener('click',e=>{
  if(state.notesOpen){ closeNotes(); return; }
  const q=e.target.closest('.it.has-q'); if(q){ q.classList.toggle('open'); return; }
  const c=e.target.closest('.cl.has-cl'); if(c){ c.parentNode.classList.toggle('open'); }
});
const themeBtn=document.getElementById('theme');
function setTheme(dark){ document.body.classList.toggle('dark',dark); themeBtn.innerHTML=dark?'&#9728;':'&#9790;';
  try{localStorage.setItem('b787dark',dark?'1':'0');}catch(e){} }
themeBtn.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark')));
let dk=false; try{dk=localStorage.getItem('b787dark')==='1';}catch(e){}
setTheme(dk);
// restore persisted phase + toggles
try{const s=JSON.parse(localStorage.getItem('b787state')||'{}');
  if(s.phase&&PHASES.find(p=>p.id===s.phase))state.phase=s.phase;
  if(s.seat)state.seat=s.seat; if(s.duty)state.duty=s.duty; if(s.appr)state.appr=s.appr; if(s.cat)state.cat=+s.cat;
  if(typeof s.hideOther==='boolean')state.hideOther=s.hideOther;
}catch(e){}
function syncToggles(){
  document.querySelectorAll('#seat button').forEach(x=>x.classList.toggle('on',x.dataset.s===state.seat));
  document.querySelectorAll('#duty button').forEach(x=>x.classList.toggle('on',x.dataset.d===state.duty));
  document.querySelectorAll('#appr button').forEach(x=>x.classList.toggle('on',x.dataset.a===state.appr));
  document.querySelectorAll('#cat button').forEach(x=>x.classList.toggle('on',+x.dataset.c===state.cat));
  setFilt();
}
syncToggles();
function setHtop(){ const h=document.querySelector('header'); if(h)document.documentElement.style.setProperty('--htop',h.offsetHeight+'px'); }
setHtop(); window.addEventListener('resize',setHtop);
document.getElementById('main').addEventListener('scroll',positionCues,{passive:true});
window.addEventListener('resize',positionCues);
window.addEventListener('orientationchange',()=>setTimeout(positionCues,380));
render(); scrollActive();
window.addEventListener('load',()=>{setHtop();fitCurrent();scrollActive();setTimeout(()=>{setHtop();fitCurrent();positionCues();},300);});
</script>
</body>
